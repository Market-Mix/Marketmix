<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Payments | MarketMix Admin</title>
	<script src="https://cdn.tailwindcss.com"></script>
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
	<link rel="stylesheet" href="css/payments.css" />
</head>
<body class="bg-gray-50 text-slate-800">
	<main class="ml-64 mt-16 p-4 md:p-6 lg:p-8">
		<div class="mb-6 flex flex-col gap-3 lg:flex-row lg:items-end lg:justify-between">
			<div>
				<p class="text-sm font-semibold uppercase tracking-[0.2em] text-blue-600">Payments</p>
				<h1 class="text-3xl font-semibold text-slate-900">Payments</h1>
				<p class="mt-2 text-sm text-slate-500">Monitor and manage payment transactions across the marketplace.</p>
			</div>
			<div class="flex flex-wrap items-center gap-3">
				<button id="refreshDataBtn" class="rounded-xl border border-slate-200 bg-white px-4 py-2.5 text-sm font-medium text-slate-700 shadow-sm">Refresh</button>
				<button id="exportBtn" class="rounded-xl border border-slate-200 bg-white px-4 py-2.5 text-sm font-medium text-slate-700 shadow-sm">Export</button>
			</div>
		</div>

		<section id="summaryCards" class="mb-6 grid gap-4 xl:grid-cols-3 lg:grid-cols-2 md:grid-cols-2"></section>

		<section class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm sm:p-6 mb-6">
			<div class="mb-5 flex flex-col gap-4 lg:flex-row lg:items-end lg:justify-between">
				<div>
					<h2 class="text-lg font-semibold text-slate-900">Transactions</h2>
					<p class="text-sm text-slate-500">Recent transactions and settlement status.</p>
				</div>
			</div>
			<div class="grid gap-4 lg:grid-cols-4">
				<label class="flex min-w-[220px] items-center gap-2 rounded-xl border border-slate-200 bg-slate-50 px-3 py-2.5 text-sm text-slate-600">
					<i class="fas fa-search text-slate-400"></i>
					<input id="searchInput" type="text" placeholder="Search payments" class="w-full border-none bg-transparent outline-none" />
				</label>
				<select id="statusFilter" class="rounded-xl border border-slate-200 bg-white px-3 py-2.5 text-sm text-slate-700">
					<option value="all">All Status</option>
					<option value="Paid">Paid</option>
					<option value="Pending">Pending</option>
					<option value="Failed">Failed</option>
				</select>
				<select id="methodFilter" class="rounded-xl border border-slate-200 bg-white px-3 py-2.5 text-sm text-slate-700">
					<option value="all">All Methods</option>
					<option value="Card">Card</option>
					<option value="Bank Transfer">Bank Transfer</option>
					<option value="Wallet">Wallet</option>
				</select>
				<select id="gatewayFilter" class="rounded-xl border border-slate-200 bg-white px-3 py-2.5 text-sm text-slate-700">
					<option value="all">All Gateways</option>
					<option value="Stripe">Stripe</option>
					<option value="Paystack">Paystack</option>
					<option value="Flutterwave">Flutterwave</option>
				</select>
				<input id="dateRangeInput" type="date" class="rounded-xl border border-slate-200 bg-white px-3 py-2.5 text-sm text-slate-700" />
			</div>
		</section>

		<div class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm sm:p-6">
			<div class="mb-4 flex items-center justify-between">
				<div>
					<h2 class="text-lg font-semibold text-slate-900">Payments</h2>
					<p class="text-sm text-slate-500">Recent payment transactions.</p>
				</div>
				<span id="paymentsCount" class="rounded-full bg-slate-100 px-3 py-2 text-sm font-semibold text-slate-700">0 transactions</span>
			</div>
			<div class="overflow-hidden rounded-2xl border border-slate-200">
				<div class="overflow-x-auto">
					<table class="min-w-full divide-y divide-slate-200">
						<thead class="bg-slate-50">
							<tr>
								<th class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-500">Transaction ID</th>
								<th class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-500">Buyer</th>
								<th class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-500">Seller</th>
								<th class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-500">Order</th>
								<th class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-500">Amount</th>
								<th class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-500">Gateway</th>
								<th class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-500">Method</th>
								<th class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-500">Status</th>
								<th class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-500">Date</th>
								<th class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-500">Actions</th>
							</tr>
						</thead>
						<tbody id="paymentsTableBody" class="divide-y divide-slate-200 bg-white text-sm text-slate-600"></tbody>
					</table>
				</div>
			</div>
		</div>

		<section class="grid gap-6 lg:grid-cols-3 mt-6">
			<div id="gatewayCards" class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm"></div>
			<div id="financeSummary" class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm"></div>
			<div id="activityTimeline" class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm"></div>
		</section>
	</main>

	<!-- Payment Modal (fragment) -->
	<div id="paymentModal" class="modal hidden">
		<div class="modal-backdrop"></div>
		<div class="modal-panel">
			<div class="px-6 py-4 border-b">
				<h3 id="modalTitle" class="text-lg font-semibold"></h3>
			</div>
			<div class="p-6 space-y-4">
				<div id="modalOverview"></div>
				<div id="modalParties" class="grid grid-cols-2 gap-3"></div>
				<div id="modalTimeline"></div>
				<p id="modalNotes" class="text-sm text-slate-600"></p>
			</div>
			<div class="px-6 py-4 border-t flex items-center justify-end gap-2">
				<button id="receiptBtn" class="rounded-xl border border-slate-200 bg-white px-4 py-2 text-sm">Receipt</button>
				<button id="printBtn" class="rounded-xl border border-slate-200 bg-white px-4 py-2 text-sm">Print</button>
				<button data-close-modal="true" class="rounded-xl bg-blue-600 px-4 py-2 text-white">Close</button>
			</div>
		</div>
	</div>

	<script src="js/payments.js"></script>
</body>
</html>
