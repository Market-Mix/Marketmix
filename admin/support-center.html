<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Support Center | MarketMix Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="css/support-center.css" />
</head>
<body class="bg-gray-50 text-slate-800">
  <main class="ml-64 mt-16 p-4 md:p-6 lg:p-8">
    <div class="mb-6 flex flex-col gap-3 lg:flex-row lg:items-end lg:justify-between">
      <div>
        <p class="text-sm font-semibold uppercase tracking-[0.2em] text-blue-600">Support Center</p>
        <h1 class="text-3xl font-semibold text-slate-900">Support Center</h1>
        <p class="mt-2 text-sm text-slate-500">Manage support tickets, customer requests, and service issues.</p>
      </div>
      <button id="refreshSupportCenterBtn" class="rounded-xl border border-slate-200 bg-white px-4 py-2.5 text-sm font-medium text-slate-700 shadow-sm"><i class="fas fa-rotate-right mr-2"></i>Refresh</button>
    </div>
    <div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
      <p class="text-sm text-slate-600">This page fragment is now valid for SPA routing.</p>
    </div>
  </main>
  <script src="js/support-center.js"></script>
</body>
</html>
