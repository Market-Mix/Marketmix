<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Support Center | MarketMix Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="css/support-center.css" />
</head>
<body class="bg-gray-50 text-slate-800">
  <main class="ml-64 mt-16 p-4 md:p-6 lg:p-8">
    <div class="mb-6 flex flex-col gap-3 lg:flex-row lg:items-end lg:justify-between">
      <div>
        <p class="text-sm font-semibold uppercase tracking-[0.2em] text-blue-600">Support Center</p>
        <h1 class="text-3xl font-semibold text-slate-900">Support Center</h1>
        <p class="mt-2 text-sm text-slate-500">Manage support tickets, customer requests, and service issues.</p>
      </div>
      <div class="flex gap-3">
        <button id="exportSupportBtn" class="rounded-xl border border-slate-200 bg-white px-4 py-2.5 text-sm font-medium text-slate-700 shadow-sm"><i class="fas fa-file-export mr-2"></i>Export</button>
        <button id="refreshSupportCenterBtn" class="rounded-xl border border-slate-200 bg-white px-4 py-2.5 text-sm font-medium text-slate-700 shadow-sm"><i class="fas fa-rotate-right mr-2"></i>Refresh</button>
      </div>
    </div>

    <section id="supportCards" class="mb-6 grid gap-4 xl:grid-cols-6 md:grid-cols-3"></section>

    <div class="grid gap-6 xl:grid-cols-[1.9fr_0.7fr]">
      <section class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm sm:p-6">
        <div class="mb-4 grid gap-3 lg:grid-cols-5">
          <input id="spSearch" placeholder="Search ticket, subject, user…" class="rounded-xl border border-slate-200 px-3 py-2.5 text-sm lg:col-span-2" />
          <select id="spStatus" class="rounded-xl border border-slate-200 px-3 py-2.5 text-sm"><option value="all">All Status</option></select>
          <select id="spPriority" class="rounded-xl border border-slate-200 px-3 py-2.5 text-sm"><option value="all">All Priority</option></select>
          <select id="spAssigned" class="rounded-xl border border-slate-200 px-3 py-2.5 text-sm">
            <option value="all">All Assignees</option><option value="me">Assigned to me</option><option value="unassigned">Unassigned</option></select>
        </div>
        <div class="overflow-x-auto rounded-2xl border border-slate-200">
          <table class="min-w-full divide-y divide-slate-200 text-sm text-slate-600">
            <thead class="bg-slate-50 text-left text-xs uppercase tracking-wide text-slate-500"><tr>
              <th class="px-4 py-3">Ticket</th><th class="px-4 py-3">Subject</th><th class="px-4 py-3">User</th>
              <th class="px-4 py-3">Priority</th><th class="px-4 py-3">Status</th><th class="px-4 py-3">Agent</th><th class="px-4 py-3">Updated</th></tr></thead>
            <tbody id="spTableBody" class="divide-y divide-slate-200 bg-white"></tbody>
          </table>
        </div>
        <div id="spPagination" class="mt-4 flex items-center justify-between text-sm text-slate-600"></div>
      </section>
      <aside class="space-y-6">
        <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
          <h3 class="text-lg font-semibold text-slate-900">By Category</h3><div id="spCategories" class="mt-4 space-y-3"></div></div>
        <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
          <h3 class="text-lg font-semibold text-slate-900">Open by Priority</h3><div id="spPriorities" class="mt-4 space-y-3"></div></div>
      </aside>
    </div>

    <div id="drawerOverlay" class="hidden fixed inset-0 z-[55] bg-slate-900/50"></div>
    <div id="ticketDrawer" class="hidden fixed inset-y-0 right-0 z-[60] flex w-full max-w-xl flex-col bg-white shadow-2xl">
      <div class="flex items-start justify-between border-b border-slate-200 px-6 py-4">
        <div><p id="tkId" class="text-xs font-semibold uppercase tracking-[0.2em] text-blue-600"></p>
          <h3 id="tkSubject" class="mt-1 text-lg font-semibold text-slate-900"></h3>
          <p id="tkUser" class="text-sm text-slate-500"></p></div>
        <button id="tkClose" class="rounded-full p-2 text-slate-500 hover:bg-slate-100"><i class="fas fa-times"></i></button>
      </div>
      <div class="grid grid-cols-3 gap-2 border-b border-slate-200 px-6 py-3">
        <select id="tkStatus" class="rounded-lg border border-slate-200 px-2 py-2 text-sm"></select>
        <select id="tkPriority" class="rounded-lg border border-slate-200 px-2 py-2 text-sm"></select>
        <select id="tkAgent" class="rounded-lg border border-slate-200 px-2 py-2 text-sm"></select>
      </div>
      <div id="tkMessages" class="flex flex-1 flex-col gap-3 overflow-y-auto px-6 py-4"></div>
      <div class="border-t border-slate-200 px-6 py-4">
        <textarea id="tkReply" rows="3" placeholder="Write a reply…" class="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm"></textarea>
        <div class="mt-2 flex items-center justify-between">
          <label class="flex items-center gap-2 text-sm text-slate-600"><input id="tkInternal" type="checkbox" /> Internal note</label>
          <div class="flex gap-2">
            <button id="tkSaveMeta" class="rounded-xl border border-slate-200 px-4 py-2 text-sm">Save changes</button>
            <button id="tkSend" class="rounded-xl bg-blue-600 px-4 py-2 text-sm font-medium text-white">Send</button></div>
        </div>
      </div>
    </div>
  </main>
  <script src="js/support-center.js"></script>
</body>
</html>
