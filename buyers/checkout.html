<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - MarketMix</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="checkout.css">
   <!-- 🔒 BLOCK UNAUTHORIZED USERS -->
    <script>
        const token = localStorage.getItem('token');
        if (!token) {
            window.location.replace("login for buyers.html");
        }
    </script>
</head>
<body>



  <button class="back" onclick="history.back()">
      <i class="fas fa-chevron-left"></i> Back
    </button>
  <div class="checkout-container">
    
    <!-- Left: Shipping Details -->
    <div class="checkout-form">
      <h2>Shipping Details</h2>
      <form id="checkoutForm">
        <label for="fullname">Full Name</label>
        <input type="text" id="fullname" placeholder="John Doe" required>

        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" required>

        <label for="phone">Phone</label>
        <input type="tel" id="phone" placeholder="+234 800 000 0000" required>

        <label for="address">Address</label>
        <textarea id="address" rows="3" placeholder="Street, City, State" required></textarea>

        <label for="payment">Payment Method</label>
        <select id="payment" required>
          <option value="">-- Select Payment Method --</option>
          <option value="card">Credit/Debit Card</option>
          <option value="paypal">PayPal</option>
          <option value="bank">Bank Transfer</option>
          <option value="cod">Cash on Delivery</option>
        </select>


        <label for="delivery">Delivery Option</label>
<select id="delivery" required>
  <option value="">-- Select Delivery Option --</option>
  <option value="marketmix">MarketMix Delivery</option>
</select>

        <label for="couponCode">Coupon Code (Optional)</label>
        <div class="coupon-input-group">
          <input type="text" id="couponCode" placeholder="Enter coupon code" style="flex: 1;">
          <button type="button" id="applyCouponBtn" style="padding: 10px 20px; background: #3b82f6; color: white; border: none; border-radius: 4px; cursor: pointer;">Apply</button>
        </div>
        <p id="couponMessage" class="hidden"></p>

      </form>
    </div>

    <!-- Right: Order Summary -->
    <div class="checkout-summary">
      <h2>Order Summary</h2>
      <ul id="orderItems">
        <li class="item"><span>Product 1</span> <span>$20</span></li>
        <li class="item"><span>Product 2</span> <span>$15</span></li>
        <li class="item"><span>Shipping</span> <span>$5</span></li>
      </ul>
      <div class="subtotal">
        <strong>Subtotal</strong>
        <span id="subtotalAmount">$40</span>
      </div>
      <div id="discountSection" class="discount" style="display: none;">
        <strong>Discount</strong>
        <span id="discountAmount">-$0</span>
      </div>
      <div class="total">
        <strong>Total</strong>
        <span id="totalAmount">$40</span>
      </div>
      <button id="placeOrderBtn">Place Order</button>
      <p id="orderMessage" class="hidden"></p>
    </div>
  </div>
<footer>
    &copy; 2025 MarketMix. All Rights Reserved.
  </footer>

  <script >
// Global state for applied coupon
let appliedCoupon = null;
let originalSubtotal = 40; // Will be updated from actual cart

// ===== APPLY COUPON FUNCTION =====
async function applyCoupon(code, productId) {
  try {
    console.log("🎟️ Validating coupon:", code, "for product:", productId);

    if (!code || code.trim() === '') {
      console.warn("⚠️ Empty coupon code");
      showCouponMessage("Please enter a coupon code", "error");
      return false;
    }

    let coupon = null;
    let couponError = null;

    // Try Supabase first
    if (typeof supabase !== 'undefined') {
      try {
        console.log("🔍 Trying Supabase - Fetching coupon...");
        const { data, error } = await supabase
          .from('coupons')
          .select('*')
          .eq('code', code.toUpperCase())
          .eq('is_active', true)
          .single();

        if (!error && data) {
          coupon = data;
          console.log("✓ Coupon found from Supabase:", coupon);
        } else {
          couponError = error?.message;
          console.log("⚠️ Supabase lookup failed:", couponError);
        }
      } catch (err) {
        console.log("⚠️ Supabase error:", err.message);
        couponError = err.message;
      }
    }

    // Fallback to API if Supabase not available or failed
    if (!coupon) {
      try {
        console.log("⚠️ Using API fallback for coupon validation...");
        const token = localStorage.getItem('token');
        const API_BASE = 'https://marketmix-backend.onrender.com/api';

        const response = await fetch(`${API_BASE}/coupons/validate`, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ code: code.toUpperCase() })
        });

        if (response.ok) {
          const data = await response.json();
          coupon = data.data?.coupon || data.coupon;
          console.log("✓ Coupon found from API:", coupon);
        } else {
          console.warn("❌ API coupon lookup failed:", response.status);
        }
      } catch (apiErr) {
        console.warn("⚠️ API fallback error:", apiErr.message);
      }
    }

    // If still no coupon found
    if (!coupon) {
      console.warn("❌ Coupon not found from any source");
      showCouponMessage("❌ Invalid coupon code", "error");
      return false;
    }

    // Check if expired
    if (coupon.expiry_date && new Date() > new Date(coupon.expiry_date)) {
      console.warn("❌ Coupon expired");
      showCouponMessage("❌ This coupon has expired", "error");
      return false;
    }

    // Check usage limit
    if (coupon.usage_limit > 0 && coupon.used_count >= coupon.usage_limit) {
      console.warn("❌ Usage limit reached");
      showCouponMessage("❌ This coupon has reached its usage limit", "error");
      return false;
    }

    // Apply discount
    const discountAmount = (originalSubtotal * coupon.discount_percent) / 100;
    const finalPrice = Math.max(0, originalSubtotal - discountAmount);

    console.log("📊 Discount calculation:", {
      originalPrice: originalSubtotal,
      discountPercent: coupon.discount_percent,
      discountAmount: discountAmount,
      finalPrice: finalPrice
    });

    // Update global state
    appliedCoupon = {
      id: coupon.id,
      code: coupon.code,
      discount_percent: coupon.discount_percent,
      discount_amount: discountAmount,
      final_price: finalPrice,
      product_id: coupon.product_id
    };

    // Update UI
    document.getElementById('discountSection').style.display = 'flex';
    document.getElementById('discountAmount').textContent = `-$${discountAmount.toFixed(2)}`;
    document.getElementById('totalAmount').textContent = `$${finalPrice.toFixed(2)}`;

    showCouponMessage(`✅ Coupon applied! You saved $${discountAmount.toFixed(2)}`, "success");
    console.log("✓ Coupon applied successfully");

    return true;

  } catch (error) {
    console.error("❌ Coupon error:", error);
    showCouponMessage("Error applying coupon. Please try again.", "error");
    return false;
  }
}

// Show coupon message
function showCouponMessage(message, type) {
  const messageEl = document.getElementById('couponMessage');
  messageEl.textContent = message;
  messageEl.className = type;
  messageEl.classList.remove('hidden');

  setTimeout(() => {
    messageEl.classList.add('hidden');
  }, 5000);
}

// Apply coupon button listener
document.addEventListener('DOMContentLoaded', () => {
  const applyCouponBtn = document.getElementById('applyCouponBtn');
  if (applyCouponBtn) {
    applyCouponBtn.addEventListener('click', async (e) => {
      e.preventDefault();
      const code = document.getElementById('couponCode').value.trim();
      const productId = localStorage.getItem('checkoutProductId') || 'demo-product-id';
      await applyCoupon(code, productId);
    });
  }

  const couponInput = document.getElementById('couponCode');
  if (couponInput) {
    couponInput.addEventListener('keypress', async (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        const code = document.getElementById('couponCode').value.trim();
        const productId = localStorage.getItem('checkoutProductId') || 'demo-product-id';
        await applyCoupon(code, productId);
      }
    });
  }
});

document.getElementById("placeOrderBtn").addEventListener("click", async () => {
  const form = document.getElementById("checkoutForm");
  const message = document.getElementById("orderMessage");

  if (form.checkValidity()) {
    try {
      // If coupon was applied, increment its usage count
      if (appliedCoupon) {
        console.log("📈 Incrementing coupon usage count...");
        const { data: currentCoupon } = await supabase
          .from('coupons')
          .select('used_count')
          .eq('id', appliedCoupon.id)
          .single();

        const { error: updateError } = await supabase
          .from('coupons')
          .update({
            used_count: (currentCoupon?.used_count || 0) + 1
          })
          .eq('id', appliedCoupon.id);

        if (updateError) {
          console.error("❌ Error updating coupon usage:", updateError);
        } else {
          console.log("✓ Coupon usage updated");
        }
      }

      message.textContent = "✅ Order placed successfully! Redirecting...";
      message.className = "success";
      message.classList.remove("hidden");

      // Clear cart and reset
      document.getElementById("orderItems").innerHTML = "<li>Your cart is empty.</li>";
      document.getElementById("totalAmount").textContent = "$0";
      document.getElementById('discountSection').style.display = 'none';
      appliedCoupon = null;

      // Redirect to buyers homepage after 2 seconds
      setTimeout(() => {
        window.location.href = '/buyers/buyers homepage.html';
      }, 2000);

    } catch (error) {
      console.error("❌ Error placing order:", error);
      message.textContent = "⚠️ Error placing order. Please try again.";
      message.className = "error";
      message.classList.remove("hidden");
    }

  } else {
    message.textContent = "⚠️ Please fill all required fields.";
    message.className = "error";
    message.classList.remove("hidden");
  }
});








  </script>
</body>
</html>
