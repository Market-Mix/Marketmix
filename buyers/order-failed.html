<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Order Failed - MarketMix</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; padding: 60px 20px; background: #fff7ed; }
    .icon { font-size: 64px; color: #dc2626; }
    h1 { color: #991b1b; }
    .btn { display: inline-block; margin-top: 20px; padding: 12px 24px; background: #f97316; color: #fff; border-radius: 8px; text-decoration: none; font-weight: 700; }
    .reason { background: #fee2e2; border: 1px solid #fecaca; border-radius: 8px; padding: 12px 20px; display: inline-block; margin: 16px 0; color: #991b1b; font-size: 14px; }
  </style>
</head>
<body>
  <div class="icon">❌</div>
  <h1>Payment Failed</h1>
  <p>Something went wrong with your payment. Your cart has not been affected.</p>
  <div class="reason" id="reasonBox" style="display:none"></div>
  <br>
  <a href="cart.html" class="btn">Back to Cart</a>
  <a href="buyers homepage.html" class="btn" style="background:#111;margin-left:10px">Continue Shopping</a>
  <script src="notification-manager.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const reason = params.get('reason');
    const status = params.get('status');
    const ref = params.get('ref');
    const box = document.getElementById('reasonBox');

    const messages = {
      cancelled: 'You cancelled the payment.',
      verification_error: 'Could not verify your payment. Please contact support with your reference.',
      missing_reference: 'Payment reference missing.',
      pending: 'Your payment is pending. We will update you once it completes.',
      failed: 'Your payment was not successful. Please try again or use another method.',
    };

    if (reason || status) {
      box.style.display = 'inline-block';
      const msg = reason ? (messages[reason] || `Payment was not successful (${reason})`) : '';
      const statusMsg = status ? (messages[status] || `Payment status: ${status}`) : '';
      box.textContent = [msg, statusMsg].filter(Boolean).join(' ');
    }
    if (ref) {
      box.style.display = 'inline-block';
      box.textContent += ` Reference: ${ref}`;
    }

    async function notifyPaymentFailure() {
      try {
        const buyerId = window.getBuyerId?.();
        const notificationKey = `checkout-payment-failed-${ref || status || reason || 'unknown'}`;
        if (!buyerId || !window.NotificationManager?.createNotification || sessionStorage.getItem(notificationKey)) return;

        const title = status === 'pending' ? 'Payment Pending' : 'Payment Failed';
        const message = status === 'pending'
          ? `Your payment is pending. Reference: ${ref || 'N/A'}`
          : `Your payment could not be completed.${ref ? ` Reference: ${ref}` : ''}`;

        await window.NotificationManager.createNotification(buyerId, {
          title,
          message,
          type: 'order',
          link: '/buyers/cart.html'
        });

        sessionStorage.setItem(notificationKey, '1');
      } catch (err) {
        console.warn('Payment failure notification failed:', err);
      }
    }

    document.addEventListener('DOMContentLoaded', notifyPaymentFailure);
  </script>
</body>
</html>
