<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shops You Follow – MarketMix</title>
  <link rel="stylesheet" href="buyers homepage.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="shortcut icon" href="marketplace.png" type="image/x-icon">
  <script>
function getToken() {
  return localStorage.getItem('buyer_token') || localStorage.getItem('token') || '';
}

    if (!localStorage.getItem('token')) window.location.replace('login for buyers.html');
  </script>
  <style>
    /* page-level overrides */
    body { background: #FFF7ED; }

    .page-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(0,0,0,0.75);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      color: white;
    }
    .page-header a { color: #F97316; font-size: 20px; }
    .page-header h1 { font-size: 18px; margin: 0; flex: 1; }
    .page-header .count-badge {
      background: #F97316;
      color: white;
      border-radius: 12px;
      padding: 2px 10px;
      font-size: 13px;
      font-weight: 700;
    }

    .shops-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      padding: 16px;
    }
    @media (min-width: 480px) { .shops-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (min-width: 768px) { .shops-grid { grid-template-columns: repeat(4, 1fr); } }
    @media (min-width: 1024px) { .shops-grid { grid-template-columns: repeat(5, 1fr); } }

    .browse-sellers-banner {
      margin: 16px 16px 0;
      background: #fff;
      border: 1px solid #fed7aa;
      border-radius: 14px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .browse-sellers-banner h2 {
      margin: 0 0 4px;
      font-size: 16px;
      color: #222;
    }
    .browse-sellers-banner p {
      margin: 0;
      color: #777;
      font-size: 13px;
    }
    .browse-sellers-banner a {
      background: #F97316;
      color: white;
      border-radius: 20px;
      padding: 9px 16px;
      text-decoration: none;
      font-weight: 700;
      white-space: nowrap;
    }
    @media (max-width: 520px) {
      .browse-sellers-banner {
        align-items: flex-start;
        flex-direction: column;
      }
    }

    .shop-card {
      background: white;
      border-radius: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
      padding: 18px 12px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: inherit;
      position: relative;
      transition: transform .2s, box-shadow .2s;
    }
    .shop-card:hover { transform: translateY(-4px); box-shadow: 0 6px 18px rgba(249,115,22,0.15); }

    .shop-card .logo {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #F97316;
      padding: 2px;
      background: #fff7ed;
    }
    .shop-card .name {
      font-size: 13px;
      font-weight: 600;
      color: #222;
      text-align: center;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .shop-card .meta {
      font-size: 11px;
      color: #888;
    }
    .shop-card .verified {
      position: absolute;
      top: 10px;
      right: 10px;
      background: #16a34a;
      color: white;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      font-size: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .unfollow-btn {
      margin-top: 4px;
      border: none;
      background: #fff0e8;
      color: #F97316;
      border-radius: 16px;
      padding: 5px 14px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s, color .2s;
    }
    .unfollow-btn:hover { background: #F97316; color: white; }
    .unfollow-btn.loading { opacity: 0.6; pointer-events: none; }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #888;
    }
    .empty-state i { font-size: 48px; color: #F97316; margin-bottom: 16px; }
    .empty-state h3 { color: #333; margin-bottom: 8px; }
    .empty-state a {
      display: inline-block;
      margin-top: 16px;
      background: #F97316;
      color: white;
      padding: 10px 24px;
      border-radius: 20px;
      text-decoration: none;
      font-weight: 600;
    }

    .load-more-wrap { text-align: center; padding: 16px; }
    .load-more-btn {
      background: white;
      border: 2px solid #F97316;
      color: #F97316;
      padding: 10px 28px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      transition: all .2s;
    }
    .load-more-btn:hover { background: #F97316; color: white; }
    .load-more-btn:disabled { opacity: 0.5; pointer-events: none; }

    .skeleton {
      background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
      background-size: 200% 100%;
      animation: shimmer 1.2s infinite;
      border-radius: 14px;
      height: 180px;
    }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  </style>
</head>
<body>

  <div class="page-header">
    <a href="buyers homepage.html"><i class="fas fa-arrow-left"></i></a>
    <h1>Shops You Follow</h1>
    <span class="count-badge" id="totalCount">0</span>
  </div>

  <main style="padding-bottom: 80px;">
    <section class="browse-sellers-banner">
      <div>
        <h2>Discover more MarketMix sellers</h2>
        <p>Browse stores by category, rating, sales, and name.</p>
      </div>
      <a href="sellers.html"><i class="fas fa-store" style="margin-right:6px"></i>Browse Sellers</a>
    </section>
    <div class="shops-grid" id="shopsGrid">
      <!-- skeletons -->
      <div class="skeleton"></div>
      <div class="skeleton"></div>
      <div class="skeleton"></div>
      <div class="skeleton"></div>
    </div>
    <div class="load-more-wrap" id="loadMoreWrap" style="display:none">
      <button class="load-more-btn" id="loadMoreBtn">Load More</button>
    </div>
  </main>

  <!-- Bottom Nav -->
  <div class="bottom-nav">
    <a href="buyers homepage.html" class="nav-link">
      <span class="icon-wrapper"><i class="fas fa-home"></i></span>
      <span class="link-text">Home</span>
    </a>
    <a href="categories.html" class="nav-link">
      <span class="icon-wrapper"><i class="fas fa-th-large"></i></span>
      <span class="link-text">Categories</span>
    </a>
    <a href="cart.html" class="nav-link cart-link">
      <span class="icon-wrapper"><i class="fas fa-shopping-cart"></i><span class="cart-count">0</span></span>
      <span class="link-text">Cart</span>
    </a>
    <a href="buyers profile.html" class="nav-link">
      <span class="icon-wrapper"><i class="fas fa-user"></i></span>
      <span class="link-text">Account</span>
    </a>
  </div>

  <script>
    const API = 'https://marketmix-backend.onrender.com/api';
    const token = localStorage.getItem('token');
    let page = 1;
    const limit = 20;
    let total = 0;

    function escapeHtml(t) {
      return t ? String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"}[c])) : '';
    }

    function avatarUrl(name) {
      return `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=F97316&color=fff&size=150`;
    }

    function renderShop(s) {
      const logo = s.store_logo || avatarUrl(s.business_name);
      const cat = s.category || '';
      const rating = parseFloat(s.rating) || 0;
      const storeHref = s.store_id || s.storeId
        ? `store-id.html?store=${encodeURIComponent(s.store_id || s.storeId)}`
        : `store-id.html?seller=${encodeURIComponent(s.seller_id || s.sellerId)}`;
      return `
        <div class="shop-card-wrap" data-seller="${s.seller_id}">
          <a href="${storeHref}" class="shop-card">
            ${s.is_verified ? '<span class="verified" title="Verified">✓</span>' : ''}
            <img class="logo" src="${escapeHtml(logo)}" alt="${escapeHtml(s.business_name)}"
              onerror="this.src='${avatarUrl(s.business_name)}'">
            <span class="name">${escapeHtml(s.business_name)}</span>
            <span class="meta">${cat ? escapeHtml(cat) + ' · ' : ''}${s.product_count || 0} products</span>
            ${rating > 0 ? `<span class="meta">⭐ ${rating.toFixed(1)}</span>` : ''}
          </a>
          <button class="unfollow-btn" data-seller="${s.seller_id}" onclick="unfollow(this, '${s.seller_id}')">
            <i class="fas fa-heart" style="margin-right:4px"></i>Following
          </button>
        </div>`;
    }

    async function loadShops(reset = false) {
      if (reset) { page = 1; document.getElementById('shopsGrid').innerHTML = '<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>'; }
      try {
        const r = await fetch(`${API}/shops/following?limit=${limit}&page=${page}`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const d = await r.json();
        const shops = d?.data?.shops || [];
        total = d?.data?.total || 0;

        document.getElementById('totalCount').textContent = total;
        const grid = document.getElementById('shopsGrid');

        if (reset) grid.innerHTML = '';
        if (!shops.length && page === 1) {
          grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1">
            <i class="fas fa-store-slash"></i>
            <h3>No shops followed yet</h3>
            <p>Follow shops to see their updates and new products here.</p>
            <a href="sellers.html">Browse Shops</a>
          </div>`;
          document.getElementById('loadMoreWrap').style.display = 'none';
          return;
        }

        grid.insertAdjacentHTML('beforeend', shops.map(renderShop).join(''));
        const wrap = document.getElementById('loadMoreWrap');
        wrap.style.display = (page * limit < total) ? 'block' : 'none';
      } catch (e) {
        document.getElementById('shopsGrid').innerHTML = `<p style="grid-column:1/-1;text-align:center;color:#888;padding:40px">Failed to load. <a href="#" onclick="location.reload()">Retry</a></p>`;
      }
    }

    async function unfollow(btn, sellerId) {
      btn.classList.add('loading');
      try {
        const r = await fetch(`${API}/shops/following/${sellerId}`, {
          method: 'DELETE',
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (r.ok) {
          try {
            const followed = JSON.parse(localStorage.getItem('followedSellerIds') || '[]')
              .filter(id => String(id) !== String(sellerId));
            localStorage.setItem('followedSellerIds', JSON.stringify(followed));
            localStorage.setItem('followedShopsChanged', String(Date.now()));
          } catch (_) {}
          const card = document.querySelector(`.shop-card-wrap[data-seller="${sellerId}"]`);
          card?.remove();
          total = Math.max(0, total - 1);
          document.getElementById('totalCount').textContent = total;
          if (!document.querySelectorAll('.shop-card-wrap').length) loadShops(true);
        }
      } catch (e) { btn.classList.remove('loading'); }
    }

    document.getElementById('loadMoreBtn')?.addEventListener('click', () => {
      page++;
      document.getElementById('loadMoreBtn').disabled = true;
      loadShops().then(() => { document.getElementById('loadMoreBtn').disabled = false; });
    });

    loadShops(true);

    // cart count
    const cart = JSON.parse(localStorage.getItem('cart') || '[]');
    const cc = cart.reduce((s,i) => s+(i.quantity||1), 0);
    const el = document.querySelector('.cart-count');
    if (el) { el.textContent = cc; el.style.display = cc > 0 ? 'inline-block' : 'none'; }
  </script>
</body>
</html>
