  <style>
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      background-color: #FFF7ED;
      color: #1e293b;
      line-height: 1.6;
    }

    .orders-container {
      max-width: 1000px;
      margin: 50px auto;
      padding: 20px;
    }

   header {
      
      color: #fff;
      text-align: center;
   
    }

    header h1 {
      font-size: 2rem;
      color:  black;
      margin-bottom: 0px;
    }

    .order-card {
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      padding: 20px;
      margin-bottom: 20px;
      transition: transform 0.2s ease;
    }

    .order-card:hover {
      transform: translateY(-3px);
    }

    .order-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 10px;
      margin-bottom: 15px;
    }

    .order-header h2 {
      font-size: 1.1rem;
      color:  #F97316;}

    .order-status {
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: capitalize;
    }

    .status-delivered { background-color: #22c55e20; color: #16a34a; }
    .status-processing { background-color: #f9731620; color: #f97316; }
    .status-shipped { background-color: #0ea5e920; color: #0ea5e9; }
    .status-cancelled { background-color: #dc262620; color: #dc2626; }

    .order-items {
      display: flex;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .order-items img {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 10px;
    }

    .order-details {
      flex: 1;
    }

    .order-details h3 {
      margin: 0;
      font-size: 1rem;
    }

    .order-details p {
      margin: 5px 0;
      font-size: 0.9rem;
      color: #475569;
    }

    .order-actions {
      margin-top: 15px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .btn-track {
      background-color: #f97316;
      color: #fff;
    }

    .btn-track:hover {
      background-color: #ea580c;
    }

    .btn-view {
      background-color: #0ea5e9;
      color: #fff;
    }

    .btn-view:hover {
      background-color: #0284c7;
    }

    .tracking-progress {
      margin-top: 15px;
      background: #f1f5f9;
      border-radius: 6px;
      padding: 10px 15px;
      font-size: 0.9rem;
      display: none;
    }

    .tracking-progress.active {
      display: block;
    }

    @media (max-width: 768px) {
      .order-items {
        flex-direction: column;
        align-items: flex-start;
      }
      .order-details h3 {
        font-size: 0.95rem;
      }

     footer {

  <script>

    function getBuyerId() {
  try {
    const userData = JSON.parse(localStorage.getItem('user') || '{}');
    return userData.id || null;
  } catch (e) {
    return null;
  }
}
    // Initialize notification system on page load

      const buyerId = getBuyerId();
      if (buyerId) {
        await NotificationManager.init(buyerId);
        initializeBadgeUpdates(buyerId);
      }
    });
  </script>
  <script>
const API_BASE = 'https://marketmix-backend.onrender.com/api';

const statusClass = {
  pending: 'status-processing', confirmed: 'status-processing',
  processing: 'status-processing', awaiting_payment: 'status-processing', shipped: 'status-shipped',
  delivered: 'status-delivered', cancelled: 'status-cancelled'
};

async function loadOrders() {
  const res = await fetch(`${API_BASE}/orders`, { headers: { Authorization: `Bearer ${token}` } });
  const data = await res.json();
  const orders = data.data?.orders || []; // flat: one card per vendor suborder
  document.getElementById('ordersContainer').innerHTML = orders.length ? orders.map(vo => {
    const items = vo.items || [], first = items[0] || {};
    const extra = items.length > 1 ? `+${items.length-1} more` : '';
    const date = new Date(vo.created_at).toLocaleDateString('en-NG',{day:'numeric',month:'short',year:'numeric'});
    return `
    <div class="order-card">
      <div class="order-header">
        <h2>Order #${vo.suborder_number || vo.vendor_order_id.slice(0,8).toUpperCase()}</h2>
        <span style="color:#64748b;font-size:.85rem">🏬 ${vo.seller_name||'Seller'} · ${date}</span>
      </div>
      <div class="order-items">
        <img src="${first.image||'https://via.placeholder.com/80'}" onerror="this.src='https://via.placeholder.com/80'">
        <div class="order-details"><h3>${first.productName||'Product'} ${extra?`<small>(${extra})</small>`:''}</h3></div>
      </div>
      <span class="order-status ${statusClass[vo.status]||'status-processing'}">${vo.status}</span>
      ${vo.tracking_code ? `<div style="margin-top:8px;font-size:.85rem">Tracking: <code>${vo.tracking_code}</code> ${vo.tracking_link?`<a href="${vo.tracking_link}" target="_blank">Track →</a>`:''}</div>` : ''}
      <div class="order-actions">
        <p style="margin:10px 0 0;font-weight:600">Total: ₦${Number((+vo.subtotal||0)+(+vo.shipping_fee||0)).toLocaleString()}</p>
        <button class="btn btn-view" onclick="viewOrder('${vo.vendor_order_id}')">View Details</button>
        ${['pending','confirmed','processing'].includes(vo.status) ? `<button class="btn" style="background:#ef4444;color:#fff" onclick="cancelOrder('${vo.vendor_order_id}',this)">Cancel</button>` : ''}
      </div>
    </div>`;
  }).join('') : '<p style="text-align:center;color:#64748b">No orders yet.</p>';
}

function trackingSteps(status) {
  const steps = ['pending','confirmed','processing','shipped','delivered'];
  const current = steps.indexOf(status);
  return `
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      ${steps.map((s, i) => `
        <span style="padding:4px 10px;border-radius:20px;font-size:0.8rem;
          background:${i <= current ? '#f97316' : '#e2e8f0'};
          color:${i <= current ? '#fff' : '#94a3b8'}">${s}</span>
        ${i < steps.length-1 ? '<span style="color:#cbd5e1">→</span>' : ''}
      `).join('')}
    </div>
    <p style="margin-top:8px;font-size:0.85rem;color:#475569">
      ${statusMessages[status] || 'Order is being processed.'}
    </p>`;
}

const statusMessages = {
  pending: '🕓 Your order has been placed and is awaiting confirmation.',
  confirmed: '✅ Order confirmed! Being prepared for dispatch.',
  processing: '📦 Your items are being packed and will ship soon.',
  shipped: '🚚 Your package is on its way!',
  delivered: '🎉 Delivered! Enjoy your purchase.',
  cancelled: '❌ This order was cancelled.'
};

async function cancelOrder(vendorOrderId, btn) {
  if (!confirm('Cancel this order?')) return;
  btn.disabled = true;
  const res = await fetch(`${API_BASE}/orders/vendor/${vendorOrderId}/cancel`, { method:'PUT', headers:{Authorization:`Bearer ${token}`} });
  const d = await res.json();
  if (!res.ok) { alert(d.message); btn.disabled=false; return; }
  alert('Order cancelled.'); loadOrders();
}

async function confirmDelivery(vendorOrderId, btn) {
  if (!confirm('Confirm you received this order?')) return;
  btn.disabled = true; btn.textContent = 'Confirming...';
  try {
    const res = await fetch(`${API_BASE}/orders/vendor/${vendorOrderId}/confirm-delivery`, {
      method: 'POST', headers: { Authorization: `Bearer ${token}` }
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.message);
    btn.textContent = 'Delivery Confirmed';
    btn.style.background = '#94a3b8';
    btn.style.cursor = 'not-allowed';
    btn.disabled = true;
  } catch (err) {
    alert(err.message);
    btn.disabled = false; btn.textContent = 'Confirm Delivery';
  }
}

function viewOrder(vendorOrderId) {
  window.location.href = `view detail.html?vendorOrderId=${vendorOrderId}`;
}

function toggleTracking(button) {
  const card = button.closest('.order-card');
  const progress = card.querySelector('.tracking-progress');
  progress.classList.toggle('active');
}

loadOrders();
</script>
