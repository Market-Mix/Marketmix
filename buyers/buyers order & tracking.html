  <style>
    body {
      font-family: 'Poppins', sans-serif;

      line-height: 1.6;
    }

    .orders-container {
      max-width: 1000px;

      padding: 20px;
    }

   header {
      
      color: #fff;
      text-align: center;
   
    }

    header h1 {
      font-size: 2rem;
      color:  black;
      margin-bottom: 0px;
    }

    .order-card {
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      padding: 20px;
      margin-bottom: 20px;
      transition: transform 0.2s ease;
    }

    .order-card:hover {
      transform: translateY(-3px);
    }

    .order-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 10px;
      margin-bottom: 15px;
    }

    .order-header h2 {
      font-size: 1.1rem;
      color:  #F97316;}

    .order-status {
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: capitalize;
    }

    .status-delivered { background-color: #22c55e20; color: #16a34a; }
    .status-processing { background-color: #f9731620; color: #f97316; }
    .status-shipped { background-color: #0ea5e920; color: #0ea5e9; }
    .status-cancelled { background-color: #dc262620; color: #dc2626; }

    .order-items {
      display: flex;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .order-items img {
      width: 80px;

      object-fit: cover;
      border-radius: 10px;

    .order-details {
      flex: 1;
    }

    .order-details h3 {
      margin: 0;
      font-size: 1rem;
    }

    .order-details p {

      font-size: 0.9rem;
      color: #475569;
    }

    .order-actions {
      margin-top: 15px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .btn-track {
      background-color: #f97316;
      color: #fff;
    }

    .btn-track:hover {
      background-color: #ea580c;
    }

    .btn-view {
      background-color: #0ea5e9;
      color: #fff;
    }

    .btn-view:hover {
      background-color: #0284c7;
    }

    .tracking-progress {
      margin-top: 15px;
      background: #f1f5f9;
      border-radius: 6px;
      padding: 10px 15px;
      font-size: 0.9rem;

    }

    .tracking-progress.active {
      display: block;

  <script>

    function getBuyerId() {

    const userData = JSON.parse(localStorage.getItem('user') || '{}');
    return userData.id || null;
  } catch (e) {
    return null;
  }
}

        await NotificationManager.init(buyerId);
        initializeBadgeUpdates(buyerId);
      }
    });
  </script>
  <script>
const API_BASE = 'https://marketmix-backend.onrender.com/api';

const statusClass = {
  pending: 'status-processing', confirmed: 'status-processing',
  processing: 'status-processing', awaiting_payment: 'status-processing', shipped: 'status-shipped',
  delivered: 'status-delivered', cancelled: 'status-cancelled'
};

async function loadOrders() {
  try {
    const res = await fetch(`${API_BASE}/orders`, {
      headers: { Authorization: `Bearer ${token}` }
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.message);

    const orders = data.data?.orders || [];
    const container = document.getElementById('ordersContainer');

    console.log('Loaded order item specifications', orders.map(order => ({
  orderId: order.id,
  sellerGroups: (order.seller_groups || []).map(sg => ({
    sellerId: sg.sellerId,
    status: sg.status,
    items: (sg.items || []).map(item => ({
      productId: item.productId,
      color: item.color,
      size: item.size,
    }))
  }))
})));

    if (!orders.length) {
      container.innerHTML = '<p style="text-align:center;color:#64748b;padding:40px">No orders yet. <a href="buyers homepage.html">Start shopping!</a></p>';
      return;
    }

    container.innerHTML = orders.map(order => {
  const sellerGroups = order.seller_groups || [];
  const date = new Date(order.created_at).toLocaleDateString('en-NG', { day:'numeric', month:'short', year:'numeric' });

  const sellerBlocksHtml = sellerGroups.map(sg => {
    const items = sg.items || [];
    const firstItem = items[0] || {};
    const extraCount = items.length > 1 ? `+${items.length - 1} more` : '';
    const imgSrc = firstItem.image || 'https://via.placeholder.com/80';
    const specMarkup = (firstItem.color || firstItem.size) ? `
      <div class="order-specs" style="margin-top:4px;color:#64748b;font-size:0.85rem">
        ${firstItem.color ? `Color: ${firstItem.color} ` : ''}${firstItem.size ? `· Size: ${firstItem.size}` : ''}
      </div>` : '';

    return `
      <div class="seller-suborder" style="border:1px solid #e2e8f0;border-radius:10px;padding:14px;margin-top:12px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <strong style="color:#475569;font-size:0.9rem">🏬 ${sg.sellerName || 'Seller'}</strong>
          <span class="order-status ${statusClass[sg.status] || 'status-processing'}">${sg.status}</span>
        </div>
        <div class="order-items" style="gap:12px">
          <img src="${imgSrc}" alt="${firstItem.productName || 'Product'}"
               style="width:60px;height:60px;object-fit:cover;border-radius:8px"
               onerror="this.src='https://via.placeholder.com/80'">
          <div class="order-details">
            <h3 style="font-size:0.95rem">${firstItem.productName || 'Product'} ${extraCount ? `<small style="color:#94a3b8">(${extraCount})</small>` : ''}</h3>
            ${specMarkup}
          </div>
        </div>
        ${(sg.courierName || sg.trackingCode) ? `
          <div style="margin-top:10px;padding:8px;background:#f0f9ff;border-radius:8px;border:1px solid #bae6fd;font-size:0.85rem">
            ${sg.courierName ? `Courier: <strong>${sg.courierName}</strong><br>` : ''}
            ${sg.trackingCode ? `Tracking ID: <code>${sg.trackingCode}</code><br>` : ''}
            ${sg.trackingLink ? `<a href="${sg.trackingLink}" target="_blank" style="color:#0ea5e9">Track Shipment →</a>` : ''}
          </div>` : ''}
      </div>`;
  }).join('');

  return `
    <div class="order-card">
      <div class="order-header">
        <h2>Order #${String(order.id).substring(0,8).toUpperCase()}</h2>
        <span style="color:#64748b;font-size:0.85rem">${sellerGroups.length} seller${sellerGroups.length === 1 ? '' : 's'} · ${date}</span>
      </div>
      ${sellerBlocksHtml}
      ${(order.status === 'delivered' && !order.delivery_confirmed_at) ? `
        <div style="margin-top:10px;padding:10px;background:#fff7ed;border:1px solid #fed7aa;border-radius:8px;font-size:0.85rem;color:#c2410c">
          <i class="fas fa-info-circle"></i> Please confirm you received this order.
          <a href="view%20detail.html?id=${order.id}" style="color:#ea580c;font-weight:600">Confirm now →</a>
        </div>` : ''}
      <div class="order-actions">
        <p style="margin:10px 0 0;font-weight:600">Total: ₦${Number(order.total_amount).toLocaleString()}</p>
        <button class="btn btn-view" onclick="viewOrder('${order.id}')">View Details</button>
        ${(order.status === 'awaiting_payment' || order.payment_status === 'unpaid') ?
          `<button class="btn btn-track" style="background:#8b5cf6" onclick="retryPayment('${order.id}', this)">💳 Resume Payment</button>` : ''}
        ${['pending','confirmed','processing'].includes(order.status) ?
          `<button class="btn" style="background:#ef4444;color:#fff" onclick="cancelOrder('${order.id}', this)">Cancel</button>` : ''}
      </div>
    </div>`;
}).join('');
  } catch (err) {
    document.getElementById('ordersContainer').innerHTML = 
      `<p style="color:#ef4444;text-align:center">Error loading orders: ${err.message}</p>`;
  }
}

function trackingSteps(status) {
  const steps = ['pending','confirmed','processing','shipped','delivered'];
  const current = steps.indexOf(status);
  return `
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      ${steps.map((s, i) => `
        <span style="padding:4px 10px;border-radius:20px;font-size:0.8rem;
          background:${i <= current ? '#f97316' : '#e2e8f0'};
          color:${i <= current ? '#fff' : '#94a3b8'}">${s}</span>
        ${i < steps.length-1 ? '<span style="color:#cbd5e1">→</span>' : ''}
      `).join('')}
    </div>
    <p style="margin-top:8px;font-size:0.85rem;color:#475569">
      ${statusMessages[status] || 'Order is being processed.'}
    </p>`;
}

const statusMessages = {
  pending: '🕓 Your order has been placed and is awaiting confirmation.',
  confirmed: '✅ Order confirmed! Being prepared for dispatch.',
  processing: '📦 Your items are being packed and will ship soon.',
  shipped: '🚚 Your package is on its way!',
  delivered: '🎉 Delivered! Enjoy your purchase.',
  cancelled: '❌ This order was cancelled.'
};

async function cancelOrder(orderId, btn) {
  if (!confirm('Cancel this order?')) return;
  btn.disabled = true; btn.textContent = 'Cancelling...';
  try {
    const res = await fetch(`${API_BASE}/orders/${orderId}/cancel`, {
      method: 'PUT', headers: { Authorization: `Bearer ${token}` }
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.message);
    alert('Order cancelled.');
    loadOrders();
  } catch (err) {
    alert(err.message);
    btn.disabled = false; btn.textContent = 'Cancel';
  }
}

async function confirmDelivery(orderId, btn) {
  if (!confirm('Confirm you received this order?')) return;
  btn.disabled = true; btn.textContent = 'Confirming...';
  try {
    const res = await fetch(`${API_BASE}/orders/${orderId}/confirm-delivery`, {
      method: 'POST', headers: { Authorization: `Bearer ${token}` }
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.message);
    
    // Make button gray after success
    btn.textContent = 'Delivery Confirmed';
    btn.style.background = '#94a3b8';
    btn.style.cursor = 'not-allowed';
    btn.disabled = true;
    
  } catch (err) {
    alert(err.message);
    btn.disabled = false; btn.textContent = 'Confirm Delivery';
  }
}

async function retryPayment(orderId, btn) {
  btn.disabled = true;
  btn.textContent = 'Loading...';
  try {
    const res = await fetch(`${API_BASE}/orders/${orderId}/retry-payment`, {
      method: 'POST',
      headers: { Authorization: `Bearer ${token}` }
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.message);
    window.location.href = data.data.paymentUrl;
  } catch (err) {
    alert(err.message || 'Could not retry payment');
    btn.disabled = false;
    btn.textContent = '💳 Continue Payment';
  }
}

function viewOrder(orderId) {
  window.location.href = `view detail.html?id=${orderId}`;
}

function toggleTracking(button) {
  const card = button.closest('.order-card');
  const progress = card.querySelector('.tracking-progress');
  progress.classList.toggle('active');
}

loadOrders();
</script>
