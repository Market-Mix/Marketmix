<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>reset password</title>
</head>
<body>
    <form id="resetForm">
  <input type="password" id="newPassword" placeholder="New password" required minlength="8" />
  <input type="password" id="confirmPassword" placeholder="Confirm password" required />
  <button class="btn" type="submit" id="resetBtn">Reset Password</button>
</form>
<p id="msg"></p>

<script>
const API = 'https://marketmix-backend.onrender.com/api';
const token = new URLSearchParams(window.location.search).get('token');
if (!token) document.getElementById('msg').textContent = 'Invalid reset link.';

document.getElementById('resetForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const newPassword = document.getElementById('newPassword').value;
  const confirm = document.getElementById('confirmPassword').value;
  const msg = document.getElementById('msg');
  if (newPassword !== confirm) { msg.textContent = 'Passwords do not match'; return; }

  try {
    const res = await fetch(`${API}/auth/reset-password`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, newPassword })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.message);
    msg.textContent = 'Password reset! Redirecting to login...';
    setTimeout(() => window.location.href = 'login for buyers.html', 2000); // or buyers login page
  } catch (err) {
    msg.textContent = err.message || 'Reset failed. Link may be expired.';
  }
});
</script>
</body>
</html>
