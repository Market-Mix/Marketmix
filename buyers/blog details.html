<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog Details | MarketMix</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root { --brand:#FF7A00; --text:#1A1A2E; --muted:#6B7280; --border:#E5E7EB; --bg:#FFF7ED; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:'Inter',system-ui,-apple-system,Arial,sans-serif; background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased; }
    a { color:inherit; text-decoration:none; }

    .topbar { position:sticky; top:0; z-index:10; background:rgba(255,255,255,.95); backdrop-filter:blur(10px);
      border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; padding:12px 20px; }
    .topbar .back { font-size:14px; font-weight:600; color:var(--muted); display:flex; align-items:center; gap:8px; }
    .topbar .back:hover { color:var(--brand); }
    .topbar .brand { font-weight:800; font-size:20px; letter-spacing:-.5px; }
    .topbar .brand span { color:var(--brand); }

    .hero { position:relative; height:clamp(240px,42vw,440px); background:#111; overflow:hidden; }
    .hero img { width:100%; height:100%; object-fit:cover; opacity:.85; }

    .article { max-width:740px; margin:-70px auto 0; position:relative; background:#fff; border-radius:16px;
      padding:clamp(22px,5vw,48px); box-shadow:0 10px 40px rgba(0,0,0,.08); }
    .tag { display:inline-block; background:#FFF3E8; color:var(--brand); font-size:12px; font-weight:700;
      padding:4px 12px; border-radius:999px; text-transform:uppercase; letter-spacing:.5px; }
    .article h1 { font-size:clamp(26px,5vw,40px); line-height:1.2; letter-spacing:-.8px; margin:14px 0; }
    .meta { display:flex; flex-wrap:wrap; align-items:center; gap:10px; color:var(--muted); font-size:14px;
      padding-bottom:22px; border-bottom:1px solid var(--border); }
    .avatar { width:36px; height:36px; border-radius:50%; background:var(--brand); color:#fff; font-weight:700;
      display:flex; align-items:center; justify-content:center; }
    .meta .dot { width:4px; height:4px; background:#cbd5e1; border-radius:50%; }

    .content { font-family:Georgia,'Times New Roman',serif; font-size:19px; line-height:1.85; color:#2d3748; margin-top:26px; }
    .content p { margin-bottom:1.3em; }
    .content p:first-child::first-letter { float:left; font-size:3.4em; line-height:.9; padding:6px 10px 0 0; font-weight:700; color:var(--brand); }

    .share { display:flex; align-items:center; gap:10px; margin-top:30px; padding-top:22px; border-top:1px solid var(--border);
      font-size:14px; font-weight:600; color:var(--muted); flex-wrap:wrap; }
    .share a, .share button { width:38px; height:38px; border-radius:50%; border:1px solid var(--border); background:#fff;
      display:flex; align-items:center; justify-content:center; color:var(--text); cursor:pointer; font-size:15px; transition:.2s; }
    .share a:hover, .share button:hover { background:var(--brand); border-color:var(--brand); color:#fff; }

    .related { max-width:1000px; margin:50px auto 0; padding:0 16px; }
    .related h3 { font-size:22px; margin-bottom:18px; letter-spacing:-.3px; }
    .related-posts { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:18px; }
    .related-card { background:#fff; border-radius:14px; overflow:hidden; border:1px solid var(--border);
      box-shadow:0 2px 10px rgba(0,0,0,.05); transition:.25s; display:flex; flex-direction:column; }
    .related-card:hover { transform:translateY(-4px); box-shadow:0 12px 28px rgba(255,122,0,.15); }
    .related-card img { width:100%; height:170px; object-fit:cover; }
    .related-card .body { padding:16px; display:flex; flex-direction:column; gap:8px; flex:1; }
    .related-card h4 { font-size:16px; line-height:1.35; }
    .related-card p { font-size:13.5px; color:var(--muted); line-height:1.5; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .related-card .more { margin-top:auto; color:var(--brand); font-weight:700; font-size:14px; }
    .related-card small { color:var(--muted); font-size:12px; }

    .state { text-align:center; padding:80px 20px; color:var(--muted); }
    .skeleton { background:linear-gradient(90deg,#f1f5f9 25%,#e2e8f0 50%,#f1f5f9 75%); background-size:200% 100%; animation:sh 1.2s infinite; border-radius:8px; }
    @keyframes sh { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

    footer { background:#111; color:#aaa; text-align:center; padding:26px 15px; margin-top:70px; font-size:14px; }
    @media (max-width:600px){ .content{font-size:17px} .article{margin-top:-40px;border-radius:12px} }
  </style>
</head>
<body>
  <div class="topbar">
    <a href="buyers homepage.html" class="back"><i class="fas fa-arrow-left"></i> Back to shop</a>
    <a href="buyers homepage.html" class="brand">market<span>mix</span></a>
    <span style="width:90px"></span>
  </div>

  <div class="hero"><img id="postCover" src="../images/marketplace.png" alt=""></div>

  <main class="article" id="article">
    <span class="tag">MarketMix Blog</span>
    <h1 id="postTitle"><span class="skeleton" style="display:block;height:38px;width:80%"></span></h1>
    <div class="meta">
      <div class="avatar" id="postAvatar">M</div>
      <span id="postAuthor">MarketMix Team</span><span class="dot"></span>
      <span id="postDate"></span><span class="dot"></span>
      <span id="postRead"></span>
    </div>
    <div id="postBody" class="content">
      <div class="skeleton" style="height:16px;margin-bottom:12px"></div>
      <div class="skeleton" style="height:16px;margin-bottom:12px;width:92%"></div>
      <div class="skeleton" style="height:16px;width:70%"></div>
    </div>
    <div class="share">
      Share:
      <a id="shWa" target="_blank" rel="noopener" title="WhatsApp"><i class="fab fa-whatsapp"></i></a>
      <a id="shX" target="_blank" rel="noopener" title="X"><i class="fab fa-twitter"></i></a>
      <a id="shFb" target="_blank" rel="noopener" title="Facebook"><i class="fab fa-facebook-f"></i></a>
      <button id="shCopy" title="Copy link"><i class="fas fa-link"></i></button>
    </div>
  </main>

  <section class="related" id="relatedWrap" hidden>
    <h3>You might also like</h3>
    <div id="relatedPosts" class="related-posts"></div>
  </section>

  <footer>&copy; 2025 MarketMix. All Rights Reserved.</footer>

  <script>
    (() => {
      const API = 'https://marketmix-backend.onrender.com/api';
      const FALLBACK = '../images/marketplace.png';
      const $ = id => document.getElementById(id);
      const esc = (v = '') => String(v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      const fmt = d => new Date(d).toLocaleDateString('en-US', { month:'long', day:'numeric', year:'numeric' });

      async function getJson(url) {
        const r = await fetch(url, { headers:{ Accept:'application/json' } });
        if (!r.ok) throw new Error(r.status);
        return (await r.json()).data;
      }

      function showError() {
        $('article').innerHTML = `<div class="state"><h2>Article not found</h2>
          <p style="margin:10px 0 18px">It may have been removed or isn't published yet.</p>
          <a href="buyers homepage.html" style="color:var(--brand);font-weight:700">← Back to MarketMix</a></div>`;
      }

      function renderPost(p) {
        const text = String(p.content || '');
        const words = text.trim().split(/\s+/).length;
        document.title = `${p.title} | MarketMix`;
        $('postCover').src = p.coverImageUrl || FALLBACK;
        $('postCover').onerror = function () { this.src = FALLBACK; };
        $('postTitle').textContent = p.title;
        $('postAuthor').textContent = p.authorName || 'MarketMix Team';
        $('postAvatar').textContent = (p.authorName || 'M')[0].toUpperCase();
        $('postDate').textContent = fmt(p.publishedAt);
        $('postRead').textContent = `${Math.max(1, Math.round(words / 200))} min read`;
        $('postBody').innerHTML = text.split(/\r?\n+/).filter(s => s.trim())
          .map(s => `<p>${esc(s.trim())}</p>`).join('') || '<p>This article is being updated.</p>';

        const url = encodeURIComponent(location.href), t = encodeURIComponent(p.title);
        $('shWa').href = `https://wa.me/?text=${t}%20${url}`;
        $('shX').href  = `https://twitter.com/intent/tweet?text=${t}&url=${url}`;
        $('shFb').href = `https://www.facebook.com/sharer/sharer.php?u=${url}`;
        $('shCopy').onclick = () => navigator.clipboard.writeText(location.href).then(() => {
          $('shCopy').innerHTML = '<i class="fas fa-check"></i>';
          setTimeout(() => $('shCopy').innerHTML = '<i class="fas fa-link"></i>', 1500);
        });
      }

      function renderRelated(list) {
        if (!list?.length) return;
        $('relatedPosts').innerHTML = list.map(r => `
          <a class="related-card" href="blog details.html?slug=${encodeURIComponent(r.slug)}">
            <img src="${esc(r.coverImageUrl || FALLBACK)}" alt="${esc(r.title)}" loading="lazy" onerror="this.src='${FALLBACK}'">
            <div class="body">
              <small>${fmt(r.publishedAt)}</small>
              <h4>${esc(r.title)}</h4>
              <p>${esc(r.excerpt || '')}</p>
              <span class="more">Read more →</span>
            </div>
          </a>`).join('');
        $('relatedWrap').hidden = false;
      }

      (async () => {
        try {
          let slug = new URLSearchParams(location.search).get('slug');
          if (!slug) {
            const { posts } = await getJson(`${API}/cms/blog?limit=1`);
            if (!posts.length) return showError();
            slug = posts[0].slug;
          }
          const { post, relatedPosts } = await getJson(`${API}/cms/blog/${encodeURIComponent(slug)}`);
          renderPost(post);
          renderRelated(relatedPosts);
        } catch (e) { console.warn('Blog detail:', e.message); showError(); }
      })();
    })();
  </script>
</body>
</html>
