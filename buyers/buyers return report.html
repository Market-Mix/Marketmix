<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Return & Refund Reports - MarketMix</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: #FFF7ED;
      color: #333;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 20px;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
    }

    /* Loading Spinner */
    .loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(255, 255, 255, 0.9);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #F97316;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Insights Dashboard */
    .dashboard {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 25px;
    }

    .card {
      background: white;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      text-align: center;
    }

    .card h3 {
      margin: 5px 0;
      font-size: 1.3em;
    }

    .card p {
      margin: 0;
      color: #777;
      font-size: 0.9em;
    }

    /* Filter bar */
    .filter-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }

    .filter-bar select {
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 0.9em;
    }

    .filter-bar button {
      background: #F97316;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9em;
    }

    .filter-bar button:hover {
      background: #EA580C;
    }

    /* Reports Table/Cards */
    .reports-container {
      display: grid;
      gap: 15px;
    }

    .report-card {
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      padding: 15px;
      border-left: 4px solid #F97316;
    }

    .report-card.pending {
      border-left-color: #F59E0B;
    }

    .report-card.under_review {
      border-left-color: #3B82F6;
    }

    .report-card.resolved {
      border-left-color: #10B981;
    }

    .report-card.rejected {
      border-left-color: #EF4444;
    }

    .report-card.refunded {
      border-left-color: #8B5CF6;
    }

    .report-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .report-id {
      font-weight: bold;
      color: #333;
    }

    .status-badge {
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.8em;
      font-weight: bold;
      text-transform: capitalize;
      color: white;
    }

    .status-badge.pending {
      background: #F59E0B;
    }

    .status-badge.under_review {
      background: #3B82F6;
    }

    .status-badge.resolved {
      background: #10B981;
    }

    .status-badge.rejected {
      background: #EF4444;
    }

    .status-badge.refunded {
      background: #8B5CF6;
    }

    .report-details {
      margin-bottom: 10px;
      font-size: 0.9em;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 5px;
      flex-wrap: wrap;
    }

    .detail-label {
      font-weight: 600;
      color: #666;
      min-width: 120px;
    }

    .detail-value {
      color: #333;
    }

    .reason-badge {
      display: inline-block;
      background: #FEE2E2;
      color: #DC2626;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.8em;
    }

    .report-description {
      background: #f9f9f9;
      padding: 10px;
      border-radius: 4px;
      margin: 10px 0;
      border-left: 3px solid #F97316;
      font-size: 0.9em;
      line-height: 1.5;
    }

    .evidence-section {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #eee;
    }

    .evidence-link {
      color: #F97316;
      text-decoration: none;
      font-size: 0.9em;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .evidence-link:hover {
      text-decoration: underline;
    }

    .response-section {
      margin-top: 10px;
      padding: 10px;
      background: #F0FDF4;
      border-radius: 4px;
      border-left: 3px solid #10B981;
    }

    .response-label {
      font-weight: 600;
      color: #059669;
      margin-bottom: 5px;
    }

    .response-text {
      color: #333;
      font-size: 0.9em;
      line-height: 1.5;
    }

    .empty-state {
      text-align: center;
      padding: 40px;
      color: #999;
    }

    .error-message {
      background: #fee;
      color: #c00;
      padding: 15px;
      border-radius: 8px;
      margin: 20px 0;
      text-align: center;
    }

    .notification {
      position: fixed;
      top: 20px;
      right: 20px;
      background: white;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      display: none;
      z-index: 999;
      max-width: 300px;
    }

    .notification.show {
      display: block;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #F97316;
      color: #fff;
      border: none;
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      margin-bottom: 20px;
      transition: 0.3s;
    }

    .back-btn:hover {
      background: #EA580C;
      transform: translateY(-2px);
    }

    /* Pagination */
    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-top: 20px;
    }

    .pagination button {
      background: #F97316;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
    }

    .pagination button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    footer {
      background: rgba(0, 0, 0, 0.7);
      color: #f8fafc;
      text-align: center;
      padding: 25px 15px;
      margin-top: 60px;
      font-size: 15px;
    }

    @media (max-width: 768px) {
      .dashboard {
        grid-template-columns: repeat(2, 1fr);
      }

      .report-header {
        flex-direction: column;
        align-items: flex-start;
      }

      .detail-row {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>

<!-- Loading Overlay -->
<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
</div>

<button class="back-btn" onclick="history.back()">
  <i class="fas fa-chevron-left"></i> Back
</button>

<div class="container">
  <h2>📋 Return & Refund Reports</h2>

  <!-- Dashboard -->
  <div class="dashboard">
    <div class="card">
      <h3 id="totalReports">0</h3>
      <p>Total Reports</p>
    </div>
    <div class="card">
      <h3 id="pendingReports">0</h3>
      <p>Pending</p>
    </div>
    <div class="card">
      <h3 id="resolvedReports">0</h3>
      <p>Resolved</p>
    </div>
    <div class="card">
      <h3 id="refundedReports">0</h3>
      <p>Refunded</p>
    </div>
  </div>

  <!-- Error Message -->
  <div id="errorMessage" class="error-message" style="display:none;"></div>

  <!-- Filter bar -->
  <div class="filter-bar">
    <select id="statusFilter">
      <option value="">All Statuses</option>
      <option value="pending">Pending</option>
      <option value="under_review">Under Review</option>
      <option value="resolved">Resolved</option>
      <option value="rejected">Rejected</option>
      <option value="refunded">Refunded</option>
    </select>
    <button onclick="applyFilters()">Filter</button>
  </div>

  <!-- Reports Container -->
  <div class="reports-container" id="reportsContainer"></div>

  <!-- Empty State -->
  <div id="emptyState" class="empty-state" style="display:none;">
    <i class="fas fa-inbox" style="font-size: 48px; color: #ccc;"></i>
    <p>No reports submitted yet</p>
  </div>

  <!-- Pagination -->
  <div class="pagination" id="pagination" style="display:none;">
    <button id="prevBtn" onclick="changePage(-1)">
      <i class="fas fa-chevron-left"></i> Previous
    </button>
    <span id="pageInfo">Page 1 of 1</span>
    <button id="nextBtn" onclick="changePage(1)">
      Next <i class="fas fa-chevron-right"></i>
    </button>
  </div>
</div>

<!-- Notification -->
<div class="notification" id="notification"></div>

<script>
  const API_BASE_URL = 'https://marketmix-backend.onrender.com';
  let currentPage = 1;
  let totalPages = 1;
  let currentFilter = '';

  // Authentication check
  function checkAuth() {
    const token = sessionStorage.getItem('token') || localStorage.getItem('token');
    if (!token) {
      window.location.replace('login for buyers.html');
      return null;
    }
    return token;
  }

  // Show/Hide Loading
  function showLoading(show = true) {
    const overlay = document.getElementById('loadingOverlay');
    overlay.style.display = show ? 'flex' : 'none';
  }

  // Show error message
  function showError(message) {
    const errorDiv = document.getElementById('errorMessage');
    errorDiv.innerText = typeof message === 'string' ? message : JSON.stringify(message);
    errorDiv.style.display = 'block';
    setTimeout(() => {
      errorDiv.style.display = 'none';
    }, 5000);
  }

  // Show notification
  function notify(message, type = 'info') {
    const notification = document.getElementById('notification');
    notification.innerText = message;
    notification.style.borderLeft = type === 'error' ? '4px solid #c00' : '4px solid #F97316';
    notification.classList.add('show');
    setTimeout(() => {
      notification.classList.remove('show');
    }, 4000);
  }

  // Format date
  function formatDate(dateString) {
    if (!dateString) return 'N/A';
    const date = new Date(dateString);
    return date.toLocaleDateString('en-US', {
      year: 'numeric',
      month: 'long',
      day: 'numeric',
      hour: '2-digit',
      minute: '2-digit'
    });
  }

  // Format currency
  function formatCurrency(amount) {
    return `₦${parseFloat(amount || 0).toFixed(2)}`;
  }

  // Load reports
  async function loadReports(page = 1) {
    const token = checkAuth();
    if (!token) return;

    showLoading(true);

    try {
      const params = new URLSearchParams({
        page: page,
        limit: 10
      });

      if (currentFilter) {
        params.append('status', currentFilter);
      }

      const response = await fetch(`${API_BASE_URL}/api/orders/reports?${params.toString()}`, {
        method: 'GET',
        headers: {
          'Authorization': `Bearer ${token}`,
          'Content-Type': 'application/json'
        }
      });

      if (!response.ok) {
        if (response.status === 401) {
          sessionStorage.clear();
          localStorage.clear();
          window.location.replace('login for buyers.html');
          return;
        }
        throw new Error(`Failed to load reports: HTTP ${response.status}`);
      }

      const data = await response.json();

      if (data.status === 'success') {
        const reports = data.data.reports || [];
        const pagination = data.data.pagination || {};

        currentPage = pagination.currentPage || 1;
        totalPages = pagination.totalPages || 1;

        await renderReports(reports);
        updatePagination();
        updateDashboard(reports);
      } else {
        throw new Error(data.message || 'Failed to load reports');
      }
    } catch (error) {
      console.error('Error loading reports:', error);
      showError(error.message || 'Failed to load reports. Please try again.');
    } finally {
      showLoading(false);
    }
  }

  // Render reports
  async function renderReports(reports) {
    const container = document.getElementById('reportsContainer');
    const emptyState = document.getElementById('emptyState');

    container.innerHTML = '';

    if (!reports || reports.length === 0) {
      emptyState.style.display = 'block';
      return;
    }

    emptyState.style.display = 'none';

    reports.forEach(report => {
      const reportCard = document.createElement('div');
      reportCard.className = `report-card ${report.status}`;

      const date = formatDate(report.created_at);
      const orderAmount = formatCurrency(report.total_amount);

      let html = `
        <div class="report-header">
          <div class="report-id">Report #${report.id} - Order #${report.order_id}</div>
          <span class="status-badge ${report.status}">${report.status.replace(/_/g, ' ')}</span>
        </div>
        
        <div class="report-details">
          <div class="detail-row">
            <span class="detail-label">Submitted:</span>
            <span class="detail-value">${date}</span>
          </div>
          <div class="detail-row">
            <span class="detail-label">Reason:</span>
            <span class="reason-badge">${report.reason.replace(/_/g, ' ')}</span>
          </div>
          <div class="detail-row">
            <span class="detail-label">Order Amount:</span>
            <span class="detail-value">${orderAmount}</span>
          </div>
        </div>
        
        <div class="report-description">
          <strong>Issue Description:</strong><br>
          ${escapeHtml(report.description)}
        </div>
      `;

      if (report.evidence_url) {
        html += `
          <div class="evidence-section">
            <a href="${escapeHtml(report.evidence_url)}" class="evidence-link" target="_blank">
              <i class="fas fa-paperclip"></i> View Evidence
            </a>
          </div>
        `;
      }

      if (report.seller_response) {
        html += `
          <div class="response-section">
            <div class="response-label">Seller Response:</div>
            <div class="response-text">${escapeHtml(report.seller_response)}</div>
            <div style="font-size: 0.8em; color: #666; margin-top: 5px;">
              Updated: ${formatDate(report.resolution_date)}
            </div>
          </div>
        `;
      }

      reportCard.innerHTML = html;
      container.appendChild(reportCard);
    });
  }

  // Update dashboard
  function updateDashboard(reports) {
    const totalReports = reports.length;
    const pendingCount = reports.filter(r => r.status === 'pending').length;
    const resolvedCount = reports.filter(r => r.status === 'resolved').length;
    const refundedCount = reports.filter(r => r.status === 'refunded').length;

    document.getElementById('totalReports').innerText = totalReports;
    document.getElementById('pendingReports').innerText = pendingCount;
    document.getElementById('resolvedReports').innerText = resolvedCount;
    document.getElementById('refundedReports').innerText = refundedCount;
  }

  // Update pagination
  function updatePagination() {
    const paginationDiv = document.getElementById('pagination');
    const pageInfo = document.getElementById('pageInfo');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    if (totalPages > 1) {
      paginationDiv.style.display = 'flex';
      pageInfo.innerText = `Page ${currentPage} of ${totalPages}`;
      prevBtn.disabled = currentPage === 1;
      nextBtn.disabled = currentPage === totalPages;
    } else {
      paginationDiv.style.display = 'none';
    }
  }

  // Change page
  function changePage(direction) {
    const newPage = currentPage + direction;
    if (newPage >= 1 && newPage <= totalPages) {
      loadReports(newPage);
    }
  }

  // Apply filters
  function applyFilters() {
    currentFilter = document.getElementById('statusFilter').value;
    currentPage = 1;
    loadReports(1);
  }

  // HTML escape
  function escapeHtml(unsafe) {
    if (!unsafe && unsafe !== 0) return '';
    return String(unsafe)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  // Initialize on page load
  document.addEventListener('DOMContentLoaded', () => {
    loadReports(1);
  });
</script>

<footer>
  © MarketMix 2025
</footer>

</body>
</html>
