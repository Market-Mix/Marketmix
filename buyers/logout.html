<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logging Out | MarketMix</title>
     <!-- 🔒 BLOCK UNAUTHORIZED USERS -->
    <script>
function getToken() {
  return localStorage.getItem('buyer_token') || localStorage.getItem('token') || '';
}

        const token = localStorage.getItem('token');
        if (!token) {
            window.location.replace("login for buyers.html");
        }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #fb923c 0%, #ea580c 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.logout-container {
    background: white;
    border-radius: 16px;
    box-shadow: 0 10px 40px rgba(234, 88, 12, 0.18);
    padding: 48px 36px;
    text-align: center;
    max-width: 400px;
    width: 100%;
}

.logo-container { margin-bottom: 24px; }
.marketmix-logo { width: 150px; height: auto; }

.spinner {
    width: 56px;
    height: 56px;
    border: 5px solid #fed7aa;
    border-top-color: #FF7A00;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 28px;
}

@keyframes spin { to { transform: rotate(360deg); } }

h1 { color: #1a1a1a; font-size: 22px; margin-bottom: 10px; font-weight: 700; }
p { color: #6b7280; font-size: 15px; line-height: 1.6; }

.success-icon {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: #ea580c;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    margin: 0 auto 18px;
    animation: scaleIn 0.5s ease-out;
}

@keyframes scaleIn { from { transform: scale(0); } to { transform: scale(1); } }

.redirect-message { margin-top: 18px; font-size: 13px; color: #9ca3af; }

.error-icon {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: #dc2626;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    margin: 0 auto 18px;
}

.btn {
    display: inline-block;
    padding: 12px 28px;
    background: #ea580c;
    color: white;
    text-decoration: none;
    border-radius: 10px;
    margin-top: 18px;
    font-weight: 600;
    box-shadow: 0 4px 12px rgba(234, 88, 12, 0.25);
    transition: all 0.2s;
}

.btn:hover {
    background: #c2410c;
    box-shadow: 0 6px 16px rgba(234, 88, 12, 0.35);
    transform: translateY(-1px);
}

@media (max-width: 480px) {
    .logout-container { padding: 36px 24px; border-radius: 12px; }
    .marketmix-logo { width: 120px; }
    h1 { font-size: 19px; }
}
    </style>
</head>
<body>
    <div class="logout-container">
        <!-- Loading State -->
        <div id="loadingState">
            <div class="logo-container">
    <svg class="marketmix-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%">
        <text x="10" y="58" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Montserrat', 'Helvetica Neue', sans-serif" font-weight="700" font-size="52" letter-spacing="-1.5px">
            <tspan fill="#000000">market</tspan><tspan fill="#ea580c">mix</tspan>
        </text>
    </svg>
</div>
            <div class="spinner"></div>
            <h1>Logging out...</h1>
            <p>Please wait while we securely log you out.</p>
        </div>

        <!-- Success State -->
        <div id="successState" style="display: none;">
            <div class="logo-container">
    <svg class="marketmix-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%">
        <text x="10" y="58" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Montserrat', 'Helvetica Neue', sans-serif" font-weight="700" font-size="52" letter-spacing="-1.5px">
            <tspan fill="#000000">market</tspan><tspan fill="#ea580c">mix</tspan>
        </text>
    </svg>
</div>
            <div class="success-icon">✓</div>
            <h1>Logged Out Successfully</h1>
            <p>You have been securely logged out of your account.</p>
            <p class="redirect-message">Redirecting to login page in <span id="countdown">3</span> seconds...</p>
            <a href="login for buyers.html" id="loginLink" class="btn">Go to Login Now</a>
        </div>

        <!-- Error State -->
        <div id="errorState" style="display: none;">
            <div class="logo-container">
    <svg class="marketmix-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%">
        <text x="10" y="58" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Montserrat', 'Helvetica Neue', sans-serif" font-weight="700" font-size="52" letter-spacing="-1.5px">
            <tspan fill="#000000">market</tspan><tspan fill="#ea580c">mix</tspan>
        </text>
    </svg>
</div>
            <div class="error-icon">⚠</div>
            <h1>Logout Error</h1>
            <p>We encountered an issue, but you've been logged out locally.</p>
            <a href="#" id="errorLoginLink" class="btn">Go to Login</a>
        </div>
    </div>

    <script>
        // =====================================================
        // LOGOUT HANDLER
        // =====================================================
const API_BASE_URL = 'https://marketmix-backend.onrender.com/api';

        async function performLogout() {
            console.log('🚪 Logout page loaded - starting logout process...');
            
            try {
                // Get token and user role from localStorage
                const token = localStorage.getItem('token');
                const userRole = localStorage.getItem('userRole') || 'buyer';
                
                // Determine the correct login page
                let loginPage = 'login for buyers.html';
                if (userRole === 'seller') {
                    loginPage = '../sellers/seller-login.html';
                } else if (userRole === 'admin') {
                    loginPage = '../admin/admin-login.html';
                }
                
                // Call backend logout endpoint if token exists
                if (token) {
                    try {
                        console.log('📤 Calling backend logout endpoint...');
                        const response = await fetch(`${API_BASE_URL}/auth/logout`, {
                            method: 'POST',
                            headers: {
                                'Authorization': `Bearer ${token}`,
                                'Content-Type': 'application/json'
                            }
                        });
                        
                        if (response.ok) {
                            console.log('✅ Backend logout successful');
                        } else {
                            console.warn('⚠️ Backend logout failed, continuing with local logout');
                        }
                    } catch (error) {
                        console.warn('⚠️ Backend logout error:', error);
                        // Continue with local logout even if backend fails
                    }
                }
                
                // Clear buyer auth/local session keys
                ['token','user','buyer_token','buyer_user','userRole','userId','refundCasesActiveCount','refundCasesUpdatedAt'].forEach(k => localStorage.removeItem(k));
                sessionStorage.removeItem('userId');
                localStorage.removeItem('authData');
                localStorage.removeItem('after_login_redirect');
                
                console.log('✅ LocalStorage cleared');
                
                // Show success state
                document.getElementById('loadingState').style.display = 'none';
                document.getElementById('successState').style.display = 'block';
                
                // Update login links
                document.getElementById('loginLink').href = loginPage;
                document.getElementById('errorLoginLink').href = loginPage;
                
                // Countdown and redirect
                let countdown = 3;
                const countdownElement = document.getElementById('countdown');
                
                const countdownInterval = setInterval(() => {
                    countdown--;
                    countdownElement.textContent = countdown;
                    
                    if (countdown <= 0) {
                        clearInterval(countdownInterval);
                        window.location.href = loginPage + '?logout=success';
                    }
                }, 1000);
                
            } catch (error) {
                console.error('❌ Logout error:', error);
                
                // Force logout even if error occurs
                ['token','user','buyer_token','buyer_user','userRole'].forEach(k => localStorage.removeItem(k));
                
                // Show error state
                document.getElementById('loadingState').style.display = 'none';
                document.getElementById('errorState').style.display = 'block';
                
                // Set error login link
                const loginPage = 'login for buyers.html';
                document.getElementById('errorLoginLink').href = loginPage;
            }
        }

        // Start logout immediately when page loads
        window.addEventListener('DOMContentLoaded', performLogout);
    </script>
</body>
</html>
