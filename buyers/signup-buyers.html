<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | MarketMix</title>
    <link rel="stylesheet" href="login for buyers.css">
    <link rel="stylesheet" href="../shared/notifications.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" integrity="sha512-z3gLpd7yknf1YoNbCzqRKc4qyor8gaKU1qmn+CShxbuBusANI9QpRohGBreCFkKxLhei6S9CQXFEbbKuqLg0DA==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <style>
        :root {
    --brand: #FF7A00;
    --brand-dark: #c2410c;
    --brand-light: #fff7ed;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #fb923c 0%, #FF7A00 100%);
    min-height: 100vh;
    padding: 20px;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
}

.login-container {
    max-width: 460px;
    width: 100%;
    margin: 20px auto;
    padding: 36px 32px;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 10px 40px rgba(234, 88, 12, 0.18);
}

.logo-container { text-align: center; margin-bottom: 24px; }
.marketmix-logo {
    width: 180px;
    height: auto;
    display: inline-block;
}

h2 {
    text-align: center;
    color: #1a1a1a;
    margin-bottom: 6px;
    font-size: 24px;
    font-weight: 700;
}

.subtitle {
    text-align: center;
    color: #6b7280;
    font-size: 14px;
    margin-bottom: 28px;
}

.input-group label { color: #374151; font-size: 13px; font-weight: 600; }

.input-group input {
    padding: 11px 14px;
    border: 1.5px solid #e5e7eb;
    border-radius: 10px;
    font-size: 14px;
    background: #f9fafb;
}

.input-group input:focus {
    border-color: var(--brand);
    background: #fff;
    box-shadow: 0 0 0 3px rgba(234, 88, 12, 0.1);
}

.input-group input.valid { border-color: #16a34a !important; background: #f0fdf4; }
.input-group input.invalid { border-color: #dc2626 !important; background: #fef2f2; }

.password-strength.weak span:nth-child(1) { background-color: #dc2626; }
.password-strength.medium span:nth-child(1),
.password-strength.medium span:nth-child(2),
.password-strength.medium span:nth-child(3) { background-color: var(--brand); }
.password-strength.strong span { background-color: #16a34a; }

.terms-checkbox input[type="checkbox"] { accent-color: var(--brand); }
.terms-checkbox a { color: var(--brand); font-weight: 600; }

.login-btn {
    background: var(--brand);
    border-radius: 10px;
    font-size: 15px;
    box-shadow: 0 4px 12px rgba(234, 88, 12, 0.25);
}
.login-btn:hover:not(:disabled) {
    background-color: var(--brand-dark);
    box-shadow: 0 6px 16px rgba(234, 88, 12, 0.35);
}

.mute{
    color:rgb(184, 164, 77);
    font-size: 12px;
}

.or { font-size: 13px; }

.signup-link a { color: var(--brand); }

.alert-success { background: var(--brand-light); border-color: #fed7aa; color: var(--brand-dark); }

/* Google button container needs fixed height so layout doesn't jump */
#google-signin-container {
    display: flex;
    justify-content: center;
    min-height: 44px;
}

/* ===== MOBILE RESPONSIVENESS ===== */
@media (max-width: 480px) {
    body {
        padding: 0;
        align-items: flex-start;
    }

    .login-container {
        max-width: 100%;
        width: 100%;
        margin: 0;
        padding: 28px 20px;
        border-radius: 0;
        min-height: 100vh;
        box-shadow: none;
    }


    .marketmix-logo {
        width: 140px;
    }

    h2 {
        font-size: 21px;
    }

    .subtitle {
        font-size: 13px;
        margin-bottom: 22px;
    }

    /* Stack first/last name instead of side-by-side */
    .input-row {
        flex-direction: column;
        gap: 0;
    }

    .input-row .input-group {
        margin-bottom: 8px;
    }

    .input-group input {
        font-size: 16px; /* prevents iOS Safari auto-zoom on focus */
        padding: 12px 14px;
    }

    .password-toggle {
        top: 38px;
    }

    .terms-checkbox label {
        font-size: 13px;
    }

    .login-btn {
        padding: 14px;
        font-size: 15px;
    }

    #google-signin-container {
        transform: scale(0.95);
        transform-origin: center;
    }
}

@media (max-width: 360px) {
    .login-container {
        padding: 24px 16px;
    }

    h2 {
        font-size: 19px;
    }
}
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo-container">
    <svg class="marketmix-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="180" height="45">
        <text x="10" y="58" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Montserrat', 'Helvetica Neue', sans-serif" font-weight="700" font-size="52" letter-spacing="-1.5px">
            <tspan fill="#000000">market</tspan><tspan fill="#FF7A00">mix</tspan>
        </text>
    </svg>
</div>
        <h2>Create an Account</h2>
         <p class="subtitle">Shop smarter on MarketMix</p>

        <form id="signupForm">
            <div class="input-row">
                <div class="input-group">
                    <label for="firstName">First Name</label>
                    <input type="text" id="firstName" placeholder="Enter first name" required autocomplete="given-name">
                </div>
                <div class="input-group">
                    <label for="lastName">Last Name</label>
                    <input type="text" id="lastName" placeholder="Enter last name" required autocomplete="family-name">
                </div>
            </div>

            <div class="input-group">
                <label for="email">Email address</label>
                <input type="email" id="email" placeholder="Enter your email" required autocomplete="email">
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Create a password" required autocomplete="new-password">
                <button type="button" class="password-toggle" onclick="togglePasswordVisibility('password')">
                    <i class="fas fa-eye"></i>
                </button>
                <div class="password-strength" id="passwordStrength">
                    <span></span><span></span><span></span><span></span>
                </div>
                <div class="password-hint" id="passwordHint">
                   <span class="mute">Use 8+ characters with uppercase, lowercase, and numbers</span> 
                </div>
            </div>

            <div class="input-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Confirm your password" required autocomplete="new-password">
                <button type="button" class="password-toggle" onclick="togglePasswordVisibility('confirmPassword')">
                    <i class="fas fa-eye"></i>
                </button>
            </div>

            <div class="terms-checkbox">
                <input type="checkbox" id="terms" required>
                <label for="terms">
                    I agree to MarketMix's <a href="Terms & Conditions.html" target="_blank">Terms of Service</a> and <a href="privacy policy.html" target="_blank">Privacy Policy</a>
                </label>
            </div>

            <button type="submit" class="login-btn" id="submitBtn">Create Account</button>

            <p class="or">Or continue with</p>

            <div class="social-login" id="google-signin-container">
                <!-- Google Sign-In button will be rendered here -->
            </div>

            <p class="signup-link">Already have an account? <a href="login for buyers.html">Log in</a></p>
        </form>
    </div>

    <script>
function getToken() {
  return localStorage.getItem('buyer_token') || localStorage.getItem('token') || '';
}

        // =====================================================
        // CONFIGURATION
        // =====================================================
        const API_BASE_URL = 'https://marketmix-backend.onrender.com/api';
        const GOOGLE_CLIENT_ID = '849940344676-n4kcsnk7ueqj3jlnbfm51nts7csg915r.apps.googleusercontent.com'; // Replace with your actual Google Client ID
        
        console.log('🚀 MarketMix Signup - API Base URL:', API_BASE_URL);

        // Rate limiting
        let lastSubmitTime = 0;
        const SUBMIT_COOLDOWN = 3000; // 3 seconds between submissions

        // =====================================================
        // FORM SUBMISSION HANDLER
        // =====================================================
        document.getElementById('signupForm').addEventListener('submit', async function(event) {
            event.preventDefault();
            console.log('📝 Form submitted');

            // Rate limiting check
            const now = Date.now();
            if (now - lastSubmitTime < SUBMIT_COOLDOWN) {
                showAlert('error', 'Please wait a moment before trying again');
                return;
            }
            lastSubmitTime = now;

            // Get and sanitize form values
            const firstName = sanitizeInput(document.getElementById('firstName').value);
            const lastName = sanitizeInput(document.getElementById('lastName').value);
            const email = sanitizeInput(document.getElementById('email').value);
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const termsAccepted = document.getElementById('terms').checked;

            console.log('📋 Form values:', { firstName, lastName, email, termsAccepted });

            // Validation
            const validation = validateForm(firstName, lastName, email, password, confirmPassword, termsAccepted);
            if (!validation.valid) {
                showAlert('error', validation.message);
                return;
            }

            // Prepare signup data for buyers (no email verification required)
            const signupData = {
                firstName: firstName,
                lastName: lastName,
                email: email.toLowerCase(),
                password: password,
                role: 'buyer',
                is_verified: true,  // Buyers don't need email verification
                is_deleted: false,
                avatar_url: null,
                google_id: null
            };

            console.log('📤 Sending signup request...');

            try {
                showLoading(true);

                const response = await fetch(`${API_BASE_URL}/auth/register`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(signupData)
                });

                console.log('📥 Response status:', response.status);
                const data = await response.json();
                console.log('📥 Response data:', data);

                showLoading(false);

                if (response.ok && data.status === 'success') {
                    // Store user data securely
                    storeAuthData(data.data.user, data.data.token);
                    
                    console.log('✅ User registered successfully');
                    showAlert('success', 'Account created successfully! Redirecting...');

                    // Merge guest wishlist then redirect to post-login target if present
                    try {
                        await (async function(){
                            const wishlist = JSON.parse(localStorage.getItem('wishlist')||'[]');
                            if (!Array.isArray(wishlist) || wishlist.length === 0) return;
                            const token = localStorage.getItem('token');
                            if (!token) return;
                            for (const item of wishlist) {
                                try { await fetch(`${API_BASE_URL}/wishlist/add`, { method: 'POST', headers: { 'Content-Type':'application/json', 'Authorization': `Bearer ${token}` }, body: JSON.stringify({ product_id: item.id }) }); } catch(e) {}
                            }
                        })();
                    } catch(e) { console.warn('merge failed', e); }

                    setTimeout(() => {
                        const target = localStorage.getItem('after_login_redirect') || localStorage.getItem('post_login_redirect') || 'buyers homepage.html';
                        try { localStorage.removeItem('after_login_redirect'); } catch (e) {}
                        try { localStorage.removeItem('post_login_redirect'); } catch (e) {}
                        window.location.href = target;
                    }, 1500);
                } else {
                    const errorMsg = getUserFriendlyError(data.message || 'Failed to create account');
                    console.error('❌ Signup error:', errorMsg);
                    showAlert('error', errorMsg);
                }
            } catch (error) {
                console.error('❌ Network error:', error);
                showLoading(false);
                showAlert('error', 'Connection problem. Please check your internet and try again.');
            }
        });

        // =====================================================
        // VALIDATION FUNCTIONS
        // =====================================================
        function validateForm(firstName, lastName, email, password, confirmPassword, termsAccepted) {
            if (!firstName || !lastName) {
                return { valid: false, message: 'First name and last name are required' };
            }

            if (firstName.length < 2 || lastName.length < 2) {
                return { valid: false, message: 'Names must be at least 2 characters long' };
            }

            if (!email) {
                return { valid: false, message: 'Email is required' };
            }

            if (!isValidEmail(email)) {
                return { valid: false, message: 'Please enter a valid email address' };
            }

            if (!password) {
                return { valid: false, message: 'Password is required' };
            }

            const passwordCheck = validatePassword(password);
            if (!passwordCheck.valid) {
                return { valid: false, message: passwordCheck.message };
            }

            if (password !== confirmPassword) {
                return { valid: false, message: 'Passwords do not match' };
            }

            if (!termsAccepted) {
                return { valid: false, message: 'Please accept the Terms of Service and Privacy Policy' };
            }

            return { valid: true };
        }

        function validatePassword(password) {
            if (password.length < 8) {
                return { valid: false, message: 'Password must be at least 8 characters long' };
            }

            const hasUpperCase = /[A-Z]/.test(password);
            const hasLowerCase = /[a-z]/.test(password);
            const hasNumbers = /\d/.test(password);

            if (!hasUpperCase || !hasLowerCase) {
                return { valid: false, message: 'Password must contain uppercase and lowercase letters' };
            }

            if (!hasNumbers) {
                return { valid: false, message: 'Password must contain at least one number' };
            }

            return { valid: true };
        }

        function isValidEmail(email) {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return emailRegex.test(email);
        }

        function sanitizeInput(input) {
            return input.trim().replace(/[<>]/g, '');
        }

        // =====================================================
        // PASSWORD STRENGTH INDICATOR
        // =====================================================
        function checkPasswordStrength(password) {
            const strengthIndicator = document.getElementById('passwordStrength');
            const hint = document.getElementById('passwordHint');
            
            if (!password) {
                strengthIndicator.classList.remove('active', 'weak', 'medium', 'strong');
                hint.classList.remove('active');
                return;
            }

            strengthIndicator.classList.add('active');
            hint.classList.add('active');

            let score = 0;
            if (password.length >= 8) score++;
            if (password.length >= 12) score++;
            if (/[a-z]/.test(password) && /[A-Z]/.test(password)) score++;
            if (/\d/.test(password)) score++;
            if (/[^a-zA-Z0-9]/.test(password)) score++;

            strengthIndicator.className = 'password-strength active';
            if (score <= 2) {
                strengthIndicator.classList.add('weak');
                hint.textContent = 'Weak password. Add more characters and variety.';
                hint.style.color = '#f44336';
            } else if (score <= 4) {
                strengthIndicator.classList.add('medium');
                hint.textContent = 'Medium strength. Consider adding special characters.';
                hint.style.color = '#ff9800';
            } else {
                strengthIndicator.classList.add('strong');
                hint.textContent = 'Strong password! ✓';
                hint.style.color = '#4CAF50';
            }
        }

        // =====================================================
        // PASSWORD VISIBILITY TOGGLE
        // =====================================================
        function togglePasswordVisibility(inputId) {
            const input = document.getElementById(inputId);
            const icon = event.target.closest('button').querySelector('i');
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        // =====================================================
        // ALERT FUNCTIONS
        // =====================================================
        function showAlert(type, message) {
            removeAlerts();
            
            const icons = {
                error: '⚠️',
                success: '✓',
                info: 'ℹ️'
            };
            
            const alert = document.createElement('div');
            alert.className = `alert alert-${type}`;
            alert.innerHTML = `
                <span class="alert-icon">${icons[type]}</span>
                <span class="alert-message">${message}</span>
                ${type !== 'success' ? '<button class="alert-close" onclick="this.parentElement.remove()">×</button>' : ''}
            `;
            
            const container = document.querySelector('.login-container');
            if (container) {
                container.insertBefore(alert, container.firstChild);
            }
            
            if (type !== 'info') {
                setTimeout(() => {
                    if (alert.parentElement) alert.remove();
                }, 6000);
            }
        }

        function removeAlerts() {
            const alerts = document.querySelectorAll('.alert');
            alerts.forEach(alert => alert.remove());
        }

        // =====================================================
        // LOADING STATE
        // =====================================================
        function showLoading(isLoading) {
            const submitBtn = document.getElementById('submitBtn');
            if (submitBtn) {
                if (isLoading) {
                    submitBtn.disabled = true;
                    submitBtn.innerHTML = '<span class="spinner"></span> Creating Account...';
                } else {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = 'Create Account';
                }
            }
        }

        // =====================================================
        // AUTH DATA STORAGE
        // =====================================================
        function storeAuthData(user, token) {
            try {
                const authData = {
                    user,
                    token,
                    expiresAt: Date.now() + (24 * 60 * 60 * 1000), // 24 hours
                    role: 'buyer'
                };
                localStorage.setItem('user', JSON.stringify(user));
                localStorage.setItem('token', token);
                localStorage.setItem('userRole', 'buyer');
                localStorage.setItem('authData', JSON.stringify(authData));
                console.log('💾 Auth data stored successfully');
            } catch (error) {
                console.error('❌ Failed to store auth data:', error);
            }
        }

        // =====================================================
        // ERROR MESSAGE MAPPING
        // =====================================================
        function getUserFriendlyError(backendMessage) {
            const errorMap = {
                'duplicate': 'This email is already registered. Please log in instead.',
                'already exists': 'This email is already registered. Please log in instead.',
                'validation failed': 'Please check your information and try again.',
                'invalid email': 'Please enter a valid email address.',
                'password': 'Please check your password requirements.',
                'network': 'Connection problem. Please check your internet.',
                'timeout': 'Request took too long. Please try again.',
                'server error': 'Something went wrong on our end. Please try again later.'
            };
            
            const lowerMessage = backendMessage.toLowerCase();
            for (const [key, value] of Object.entries(errorMap)) {
                if (lowerMessage.includes(key)) {
                    return value;
                }
            }
            
            return backendMessage || 'Something went wrong. Please try again.';
        }

        // =====================================================
        // REAL-TIME VALIDATION
        // =====================================================
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🎯 Page loaded, initializing validation...');
            
            // Auto-focus first name field
            document.getElementById('firstName').focus();
            
            // Email validation
            const emailInput = document.getElementById('email');
            emailInput.addEventListener('input', function() {
                if (this.value.length > 3) {
                    if (isValidEmail(this.value)) {
                        this.classList.remove('invalid');
                        this.classList.add('valid');
                    } else {
                        this.classList.add('invalid');
                        this.classList.remove('valid');
                    }
                } else {
                    this.classList.remove('invalid', 'valid');
                }
            });

            // Password strength check
            const passwordInput = document.getElementById('password');
            passwordInput.addEventListener('input', function() {
                checkPasswordStrength(this.value);
            });

            // Confirm password validation
            const confirmPasswordInput = document.getElementById('confirmPassword');
            confirmPasswordInput.addEventListener('input', function() {
                const password = passwordInput.value;
                if (this.value) {
                    if (this.value === password) {
                        this.classList.remove('invalid');
                        this.classList.add('valid');
                    } else {
                        this.classList.add('invalid');
                        this.classList.remove('valid');
                    }
                } else {
                    this.classList.remove('invalid', 'valid');
                }
            });

            console.log('✅ Validation initialized successfully');
        });

        // =====================================================
        // GOOGLE SIGN-IN (Placeholder)
        // =====================================================
        // To enable Google Sign-In:
        // 1. Get your Google Client ID from https://console.cloud.google.com/
        // 2. Replace GOOGLE_CLIENT_ID at the top of this file
        // 3. Uncomment the code below
        
        
       // Wait for Google script to actually load before initializing
function initGoogleSignIn() {
    if (!window.google || !window.google.accounts) {
        return setTimeout(initGoogleSignIn, 200); // retry until script loads
    }
    window.google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID,
        callback: handleGoogleSignIn,
        auto_select: false
    });
   window.google.accounts.id.renderButton(
    document.getElementById('google-signin-container'),
    { theme: 'outline', size: 'large', width: Math.min(320, window.innerWidth - 80), text: 'signup_with' }
       );
    console.log('✅ Google Sign-In initialized');
}
initGoogleSignIn();

        async function handleGoogleSignIn(response) {
            console.log('🔐 Google Sign-In initiated');
            showLoading(true);
            
            try {
                const token = response.credential;
                const decoded = parseJwt(token);
                
                const signupData = {
                    firstName: decoded.given_name || '',
                    lastName: decoded.family_name || '',
                    email: decoded.email,
                    googleId: decoded.sub,
                    role: 'buyer'
                };

                const apiResponse = await fetch(`${API_BASE_URL}/auth/google-register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(signupData)
                });

                const data = await apiResponse.json();
                showLoading(false);

                if (apiResponse.ok && data.status === 'success') {
                    storeAuthData(data.data.user, data.data.token);
                    showAlert('success', 'Signed up with Google! Redirecting...');
                    try {
                        await (async function(){
                            const wishlist = JSON.parse(localStorage.getItem('wishlist')||'[]');
                            if (!Array.isArray(wishlist) || wishlist.length === 0) return;
                            const token = localStorage.getItem('token');
                            if (!token) return;
                            for (const item of wishlist) {
                                try { await fetch(`${API_BASE_URL}/wishlist/add`, { method: 'POST', headers: { 'Content-Type':'application/json', 'Authorization': `Bearer ${token}` }, body: JSON.stringify({ product_id: item.id }) }); } catch(e) {}
                            }
                        })();
                    } catch(e) { console.warn('merge failed', e); }
                    setTimeout(() => {
                        const target = localStorage.getItem('after_login_redirect') || localStorage.getItem('post_login_redirect') || 'buyers homepage.html';
                        try { localStorage.removeItem('after_login_redirect'); } catch (e) {}
                        try { localStorage.removeItem('post_login_redirect'); } catch (e) {}
                        window.location.href = target;
                    }, 1500);
                } else {
                    showAlert('error', getUserFriendlyError(data.message));
                }
            } catch (error) {
                console.error('❌ Google sign-in error:', error);
                showLoading(false);
                showAlert('error', 'Google Sign-In failed. Please try again.');
            }
        }

        function parseJwt(token) {
            const base64Url = token.split('.')[1];
            const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            const jsonPayload = decodeURIComponent(atob(base64).split('').map(c => {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        }
        
    </script>
