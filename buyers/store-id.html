<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Store Profile | MarketMix</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="store-id.css" />
  <script>
    const token = localStorage.getItem('token');
    if (!token) window.location.replace("login for buyers.html");
  </script>
</head>
<body>

  <!-- Store Header / Banner -->
  <div class="store-header" id="storeHeader">
    <div class="store-logo" id="storeLogo">
      <span id="storeLogoFallback"></span>
    </div>
    <!-- Verified badge -->
    <span class="verified-badge" id="verifiedBadge" style="display:none">
      <i class="fa-solid fa-circle-check"></i> Verified Seller
    </span>
  </div>

  <!-- Store Info -->
  <div class="store-info">
    <div class="store-details">
      <h2 id="storeName">Loading...</h2>
      <p id="storeRatingRow">
        <i class="fa-solid fa-star" style="color:gold"></i>
        <span id="storeRating">—</span>
        <span id="storeReviewCount"></span>
      </p>
      <p id="storeAddress" class="store-meta"></p>
      <p id="storeMemberSince" class="store-meta"></p>
    </div>
    <div class="store-actions">
      <button id="followBtn" onclick="toggleFollow()">
        <i class="fa-regular fa-heart"></i> Follow
      </button>
      <button id="contactBtn" onclick="contactSeller()">
        <i class="fa-solid fa-envelope"></i> Contact Seller
      </button>
    </div>
  </div>

  <!-- Stats Strip -->
  <div class="store-stats" id="storeStats">
    <div class="stat"><span id="statProducts">—</span><small>Products</small></div>
    <div class="stat"><span id="statSales">—</span><small>Sales</small></div>
    <div class="stat"><span id="statRating">—</span><small>Rating</small></div>
    <div class="stat"><span id="statReviews">—</span><small>Reviews</small></div>
  </div>

  <!-- Tabs -->
  <div class="store-tabs">
    <button class="tab-btn active" data-tab="products">Products</button>
    <button class="tab-btn" data-tab="reviews">Reviews</button>
    <button class="tab-btn" data-tab="about">About</button>
    <button class="tab-btn" data-tab="policies">Policies</button>
  </div>

  <!-- Products Tab -->
  <section id="products" class="tab-content active">
    <div class="filter-bar">
      <select id="categoryFilter">
        <option value="all">All Categories</option>
      </select>
      <span id="productCountLabel"></span>
    </div>
    <div id="productsGrid" class="products-grid">
      <div class="loading-state">
        <i class="fa-solid fa-spinner fa-spin"></i> Loading products...
      </div>
    </div>
    <div id="loadMoreWrap" style="text-align:center;margin:20px 0;display:none">
      <button id="loadMoreBtn" onclick="loadMoreProducts()">Load More</button>
    </div>
  </section>

  <!-- Reviews Tab -->
  <section id="reviews" class="tab-content">
    <div id="reviewsSummary" class="reviews-summary"></div>
    <div id="reviewsList" class="reviews-list">
      <div class="loading-state"><i class="fa-solid fa-spinner fa-spin"></i> Loading reviews...</div>
    </div>
  </section>

  <!-- About Tab -->
  <section id="about" class="tab-content">
    <div id="aboutContent" class="about-content">
      <p class="loading-state"><i class="fa-solid fa-spinner fa-spin"></i> Loading...</p>
    </div>
  </section>

  <!-- Policies Tab -->
  <section id="policies" class="tab-content">
    <div class="policies-content" id="policiesContent">
      <ul>
        <li><strong>Shipping:</strong> Orders ship within 2–3 business days.</li>
        <li><strong>Returns:</strong> Returns accepted within 7 days of delivery.</li>
        <li><strong>Contact:</strong> <span id="policyEmail">—</span></li>
      </ul>
    </div>
  </section>

  <!-- Toast -->
  <div id="toast"></div>

  <script src="store-id.js"></script>
</body>
</html>
