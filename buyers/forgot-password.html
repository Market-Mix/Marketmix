<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Forgot Password — MarketMix Buyers</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --bg: #f4f1ec; --card: #ffffff; --ink: #1a1a1a; --ink2: #5a5a5a;
      --accent:  #FF7A00; --accent-light: #dbeafe; --border: #e5e0d8;
      --red: #dc2626; --green: #16a34a; --r: 14px;
      --shadow: 0 8px 32px rgba(0,0,0,0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--ink);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }
    .box {
      width: 100%; max-width: 420px; background: var(--card);
      border-radius: var(--r); border: 1px solid var(--border);
      box-shadow: var(--shadow); padding: 36px 32px; text-align: center;
    }
    .icon-badge {
      width: 56px; height: 56px; border-radius: 50%;
      background: var(--accent-light); color: var(--accent);
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; margin: 0 auto 18px;
    }
    .brand { font-family: 'Playfair Display', serif; font-size: 1.1rem; color: var(--accent); margin-bottom: 4px; }
    h2 { font-size: 1.4rem; margin-bottom: 8px; }
    p.sub { color: var(--ink2); font-size: 13.5px; line-height: 1.6; margin-bottom: 24px; }
    .form-group { text-align: left; margin-bottom: 18px; }
    .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
    input {
      width: 100%; padding: 11px 14px; border: 1.5px solid var(--border);
      border-radius: 9px; font-size: 14px; font-family: 'DM Sans', sans-serif;
      background: #fff; transition: border-color .2s;
    }
    input:focus { outline: none; border-color: var(--accent); }
    .btn {
      width: 100%; padding: 12px; border: none; border-radius: 9px;
      font-size: 14.5px; font-weight: 600; cursor: pointer;
      background: var(--accent); color: #fff;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: opacity .2s, transform .1s;
    }
    .btn:active { transform: scale(.98); }
    .btn:disabled { opacity: .6; cursor: not-allowed; }
    #msg {
      margin-top: 16px; font-size: 13.5px; padding: 10px 12px;
      border-radius: 8px; display: none; line-height: 1.5;
    }
    #msg.show { display: block; }
    #msg.success { background: #f0fdf4; color: var(--green); border: 1px solid #bbf7d0; }
    #msg.error   { background: #fef2f2; color: var(--red); border: 1px solid #fecaca; }
    .back-link {
      display: inline-flex; align-items: center; gap: 6px; margin-top: 22px;
      color: var(--ink2); font-size: 13px; text-decoration: none;
    }
    .back-link:hover { color: var(--accent); }
  </style>
</head>
<body>
  <div class="box">
    <div class="icon-badge"><i class="fas fa-key"></i></div>
    <div class="brand">MarketMix</div>
    <h2>Forgot your password?</h2>
    <p class="sub">Enter the email linked to your buyer account and we'll send you a link to reset it.</p>

    <form id="forgotForm">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="email" placeholder="you@example.com" required />
      </div>
      <button class="btn" type="submit" id="submitBtn">
        <i class="fas fa-paper-plane"></i> Send reset instructions
      </button>
    </form>

    <div id="msg"></div>

    <a href="login for buyers.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to login</a>
  </div>

<script>
const API = 'https://marketmix-backend.onrender.com/api';
const form = document.getElementById('forgotForm');
const btn  = document.getElementById('submitBtn');
const msg  = document.getElementById('msg');

function showMsg(text, type) {
  msg.textContent = text;
  msg.className = `show ${type}`;
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...';

  try {
    const res = await fetch(`${API}/auth/forgot-password`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: document.getElementById('email').value.trim(), role: 'buyer' })
    });
    const data = await res.json();
    showMsg(data.message || 'Check your email for reset instructions.', 'success');
    form.querySelector('input').value = '';
  } catch (err) {
    showMsg('Something went wrong. Please try again.', 'error');
  }

  btn.disabled = false;
  btn.innerHTML = '<i class="fas fa-paper-plane"></i> Send reset instructions';
});
</script>
</body>
</html>
