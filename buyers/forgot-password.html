<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | MarketMix</title>
    <link rel="stylesheet" href="login for buyers.css">
    <style>
        .reset-text {
            color: #666;
            font-size: 14px;
            margin: 15px 0 25px;
            line-height: 1.6;
        }

        .back-to-login {
            display: block;
            margin-top: 20px;
            color: #2B6CB0;
            text-decoration: none;
            font-size: 14px;
        }

        .back-to-login:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <form id="forgotForm">
  <input type="email" id="email" placeholder="Enter your email" required />
  <button class="btn" type="submit" id="submitBtn">Send reset instructions</button>
</form>
<p id="msg" style="margin-top:10px"></p>

<script>
const API = 'https://marketmix-backend.onrender.com/api';
document.getElementById('forgotForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  const msg = document.getElementById('msg');
  btn.disabled = true; btn.textContent = 'Sending...';
  try {
    const res = await fetch(`${API}/auth/forgot-password`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: document.getElementById('email').value, role: 'buyer' })
    });
    const data = await res.json();
    msg.textContent = data.message || 'Check your email for reset instructions.';
  } catch (err) {
    msg.textContent = 'Something went wrong. Try again.';
  }
  btn.disabled = false; btn.textContent = 'Send reset instructions';
});
</script>
</body>
</html>
