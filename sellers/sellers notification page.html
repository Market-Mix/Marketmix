<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Seller Notifications - MarketMix</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body {
      font-family: 'Poppins', Inter, Arial, sans-serif;
      margin: 0;
      background: #e2e8f0;
      color: #0f172a;
    }

    .wrap {
      max-width: 820px;
      margin: 40px auto;
      padding: 20px;
    }

    .loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(255, 255, 255, 0.9);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #1d4ed8;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .notification-page {
      background: #ffffff;
      border-radius: 18px;
      border: 1px solid #bfdbfe;
      box-shadow: 0 16px 32px rgba(30, 64, 175, 0.08);
      padding: 24px 28px;
    }

    .notification-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
      border-bottom: 2px solid #bfdbfe;
      padding-bottom: 12px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .notification-header h2 {
      font-size: 22px;
      font-weight: 600;
      color: #1E293B;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .unread-badge {
      background: #1d4ed8;
      color: white;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
    }

    .controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn {
      background: #fff;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid #e6e6e6;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn:hover {
      background: #eef2ff;
      border-color: #93c5fd;
    }

    .btn-primary {
      background: #1d4ed8;
      color: white;
      border: none;
    }

    .btn-primary:hover {
      background: #1e40af;
    }

    .back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #1d4ed8;
      color: #fff;
      border: none;
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
      margin-bottom: 20px;
    }

    .back i {
      font-size: 18px;
    }

    .back:hover {
      background: #1e40af;
      transform: translateY(-2px);
    }

    .filter-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    .filter-tab {
      padding: 8px 16px;
      background: #fff;
      border: 1px solid #e6e6e6;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.3s;
    }

    .filter-tab.active {
      background: #1d4ed8;
      color: white;
      border-color: #1d4ed8;
    }

    .notif-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 12px;
    }

    .notif {
      background: #fff;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(30, 41, 59, 0.06);
      display: flex;
      gap: 12px;
      align-items: flex-start;
      border-left: 4px solid transparent;
      transition: all 0.3s;
    }

    .notif:hover {
      box-shadow: 0 4px 12px rgba(30, 41, 59, 0.12);
      transform: translateY(-2px);
    }

    .notif {
      cursor: pointer;
    }

    .notif:hover {
      background: #F0F7FF;
    }

    .notif.unread {
      border-left-color: #1d4ed8;
      background: #eff6ff;
    }

    .notif-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 18px;
      flex-shrink: 0;
    }

    .notif-icon.info { background: #dbeafe; color: #1d4ed8; }
    .notif-icon.success { background: #dcfce7; color: #16a34a; }
    .notif-icon.warning { background: #e0f2fe; color: #0c4a6e; }
    .notif-icon.error { background: #fee2e2; color: #991b1b; }

    .notif .meta { flex: 1; }

    .notif-title {
      font-weight: 600;
      font-size: 15px;
      margin-bottom: 4px;
      color: #1E293B;
    }

    .notif-message {
      font-size: 14px;
      color: #475569;
      line-height: 1.5;
    }

    .notif .time {
      color: #94a3b8;
      font-size: 12px;
      margin-top: 6px;
    }

    .notif-actions {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .notif-actions button {
      font-size: 12px;
      padding: 6px 10px;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #94A3B8;
    }

    .empty-state i {
      font-size: 48px;
      color: #1d4ed8;
      margin-bottom: 15px;
    }

    .empty-state p {
      font-size: 16px;
      margin: 10px 0 0 0;
    }

    .error-message {
      background: #FEE;
      color: #C00;
      padding: 15px;
      border-radius: 8px;
      margin: 20px 0;
      text-align: center;
    }

    footer {
      background: rgba(0, 0, 0, 0.7);
      color: #f8fafc;
      text-align: center;
      padding: 25px 15px;
      margin-top: 60px;
      font-size: 15px;
    }

    @media (max-width: 768px) {
      .wrap { padding: 10px; margin: 10px auto; }
      .notification-header { flex-direction: column; align-items: flex-start; }
      .controls { width: 100%; }
      .btn { flex: 1; }
      .notif { flex-direction: column; }
      .notif-actions { flex-direction: row; width: 100%; }
      .notif-actions button { flex: 1; }
    }
  </style>
</head>
<body>

  <div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
  </div>

  <div class="wrap">
    <button class="back" onclick="history.back()">
      <i class="fas fa-chevron-left"></i> Back
    </button>

    <div class="notification-page">
      <div class="notification-header">
        <h2>
          <i class="fas fa-bell"></i>
          Seller Notifications
          <span class="unread-badge" id="unreadBadge">0</span>
        </h2>
        <div class="controls">
          <button class="btn" id="markAllBtn">
            <i class="fas fa-check-double"></i> Mark all read
          </button>
          <button class="btn" id="clearAllBtn">
            <i class="fas fa-trash"></i> Clear all
          </button>
        </div>
      </div>

      <div class="filter-tabs">
        <div class="filter-tab active" data-filter="all">
          <i class="fas fa-list"></i> All
        </div>
        <div class="filter-tab" data-filter="unread">
          <i class="fas fa-envelope"></i> Unread
        </div>
      </div>

      <div id="errorMessage" class="error-message" style="display:none;"></div>
      <div id="notifList" class="notif-list"></div>
      <div id="emptyState" class="empty-state" style="display:none;">
        <i class="fas fa-bell-slash"></i>
        <p>You're all caught up! No notifications.</p>
      </div>
    </div>
  </div>

  <footer>&copy; 2025 MarketMix. All Rights Reserved.</footer>

  <script>
    window.API_BASE_URL = window.API_BASE_URL || 'https://marketmix-backend.onrender.com/api';
    let notifications = [];
    let currentFilter = 'all';

    function checkAuth() {
      const token = localStorage.getItem('token') || sessionStorage.getItem('token');
      if (!token) {
        window.location.replace('sellers login.html');
        return null;
      }
      return token;
    }

    function showLoading(show = true) {
      document.getElementById('loadingOverlay').style.display = show ? 'flex' : 'none';
    }

    function showError(message) {
      const errorDiv = document.getElementById('errorMessage');
      errorDiv.innerText = message;
      errorDiv.style.display = 'block';
      setTimeout(() => { errorDiv.style.display = 'none'; }, 5000);
    }

    async function markAllNotificationsReadOnVisit() {
      const token = checkAuth();
      if (!token) return;
      try {
        const response = await fetch(`${window.API_BASE_URL}/notifications/read-all`, {
          method: 'PUT',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          }
        });
        if (!response.ok) {
          const errorData = await response.json().catch(() => ({}));
          console.warn('Failed to mark all notifications as read on visit:', errorData.message);
        }
      } catch (error) {
        console.error('Error auto-marking notifications as read:', error);
      }
    }

    function timeAgo(dateString) {
      const date = new Date(dateString);
      const now = new Date();
      const seconds = Math.floor((now - date) / 1000);
      if (seconds < 60) return 'Just now';
      const minutes = Math.floor(seconds / 60);
      if (minutes < 60) return `${minutes}m ago`;
      const hours = Math.floor(minutes / 60);
      if (hours < 24) return `${hours}h ago`;
      const days = Math.floor(hours / 24);
      if (days < 7) return `${days}d ago`;
      const weeks = Math.floor(days / 7);
      if (weeks < 4) return `${weeks}w ago`;
      return `${Math.floor(days / 30)}mo ago`;
    }

    function getNotifIcon(type) {
      return 'fa-check-circle';
    }

    async function fetchNotifications(unreadOnly = false) {
      const token = checkAuth();
      if (!token) return;

      showLoading(true);
      try {
        const url = unreadOnly
          ? `${window.API_BASE_URL}/notifications?unread=true`
          : `${window.API_BASE_URL}/notifications`;
        const response = await fetch(url, {
          method: 'GET',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          }
        });

        if (!response.ok) {
          if (response.status === 401) {
            sessionStorage.clear();
            localStorage.clear();
            window.location.replace('sellers login.html');
            return;
          }
          const errorData = await response.json();
          throw new Error(errorData.message || 'Failed to fetch notifications');
        }

        const data = await response.json();
        if (data.status === 'success') {
          notifications = data.data.notifications || [];
          updateUnreadBadge(data.data.unreadCount || 0);
          renderNotifications(notifications);
        } else {
          throw new Error(data.message || 'Failed to load notifications');
        }
      } catch (error) {
        console.error('Error fetching notifications:', error);
        showError('Failed to load notifications. Please try again.');
      } finally {
        showLoading(false);
      }
    }

    function renderNotifications(list) {
      const container = document.getElementById('notifList');
      const emptyState = document.getElementById('emptyState');
      container.innerHTML = '';
      if (list.length === 0) {
        emptyState.style.display = 'block';
        container.style.display = 'none';
        return;
      }
      emptyState.style.display = 'none';
      container.style.display = 'flex';

      list.forEach(n => {
        const el = document.createElement('div');
        el.className = 'notif' + (n.isRead ? '' : ' unread');
        el.style.cursor = 'pointer';
        const iconClass = getNotifIcon(n.type);
        const typeClass = 'success';

        el.innerHTML = `
          <div class="notif-icon ${typeClass}">
            <i class="fas ${iconClass}"></i>
          </div>
          <div class="meta">
            <div class="notif-title">${n.title}</div>
            <div class="notif-message">${n.message}</div>
            <div class="time">${timeAgo(n.createdAt)}</div>
          </div>
          <div class="notif-actions">
            <button class="btn" onclick="toggleRead('${n.id}', ${n.isRead})">
              <i class="fas ${n.isRead ? 'fa-envelope' : 'fa-envelope-open'}"></i>
              ${n.isRead ? 'Unread' : 'Read'}
            </button>
            <button class="btn" onclick="removeNotif('${n.id}')">
              <i class="fas fa-trash"></i> Remove
            </button>
          </div>
        `;
        
        // Add click handler to navigate to the notification link (normalize link to avoid 404s)
        el.addEventListener('click', function(e) {
          if (e.target.closest('.notif-actions')) {
            e.stopPropagation();
            return;
          }

          function normalizeSellerLink(rawLink) {
            if (!rawLink) return null;
            let link = String(rawLink).trim();
            // Replace backslashes with slashes and normalize the path if it contains encoded characters
            link = link.replace(/\\/g, '/');
            try {
              link = decodeURI(link);
            } catch (decodeError) {
              // ignore invalid URI sequences
            }
            // If already absolute URL, use it directly
            if (/^https?:\/\//i.test(link)) return link;
            // For relative/root paths, return as-is to preserve proper navigation
            return link;
          }

          if (n.link) {
            try {
              const target = normalizeSellerLink(n.link);
              if (target) {
                // Use relative path navigation for static files
                window.location.href = target.startsWith('/') ? target : './' + target;
              }
            } catch (linkErr) {
              console.error('Invalid notification link:', n.link, linkErr);
              // fallback to raw link
              if (n.link) {
                window.location.href = n.link.startsWith('/') ? n.link : './' + n.link;
              }
            }
          }
        });
        
        container.appendChild(el);
      });
    }

    function updateUnreadBadge(count) {
      const badge = document.getElementById('unreadBadge');
      badge.innerText = count;
      badge.style.display = count > 0 ? 'inline-block' : 'none';
    }

    async function toggleRead(id, currentlyRead) {
      const token = checkAuth();
      if (!token) return;
      if (currentlyRead) {
        alert('Notifications can only be marked as read, not unread.');
        return;
      }
      showLoading(true);
      try {
        const response = await fetch(`${window.API_BASE_URL}/notifications/${id}/read`, {
          method: 'PUT',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          }
        });
        if (!response.ok) throw new Error('Failed to mark as read');
        const data = await response.json();
        if (data.status === 'success') {
          await fetchNotifications(currentFilter === 'unread');
        }
      } catch (error) {
        console.error('Error marking as read:', error);
        showError('Failed to mark notification as read');
      } finally {
        showLoading(false);
      }
    }

    async function removeNotif(id) {
      if (!confirm('Are you sure you want to delete this notification?')) return;
      const token = checkAuth();
      if (!token) return;
      showLoading(true);
      try {
        const response = await fetch(`${window.API_BASE_URL}/notifications/${id}`, {
          method: 'DELETE',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          }
        });
        if (!response.ok) throw new Error('Failed to delete notification');
        const data = await response.json();
        if (data.status === 'success') {
          await fetchNotifications(currentFilter === 'unread');
        }
      } catch (error) {
        console.error('Error deleting notification:', error);
        showError('Failed to delete notification');
      } finally {
        showLoading(false);
      }
    }

    document.getElementById('markAllBtn').addEventListener('click', async () => {
      const token = checkAuth();
      if (!token) return;
      showLoading(true);
      try {
        const response = await fetch(`${window.API_BASE_URL}/notifications/read-all`, {
          method: 'PUT',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          }
        });
        if (!response.ok) throw new Error('Failed to mark all as read');
        const data = await response.json();
        if (data.status === 'success') {
          await fetchNotifications(currentFilter === 'unread');
        }
      } catch (error) {
        console.error('Error marking all as read:', error);
        showError('Failed to mark all notifications as read');
      } finally {
        showLoading(false);
      }
    });

    document.getElementById('clearAllBtn').addEventListener('click', async () => {
      if (!confirm('Are you sure you want to delete ALL notifications? This cannot be undone.')) return;
      const token = checkAuth();
      if (!token) return;
      showLoading(true);
      try {
        const response = await fetch(`${window.API_BASE_URL}/notifications`, {
          method: 'DELETE',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          }
        });
        if (!response.ok) throw new Error('Failed to clear notifications');
        const data = await response.json();
        if (data.status === 'success') {
          notifications = [];
          renderNotifications([]);
          updateUnreadBadge(0);
        }
      } catch (error) {
        console.error('Error clearing notifications:', error);
        showError('Failed to clear notifications');
      } finally {
        showLoading(false);
      }
    });

    document.querySelectorAll('.filter-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentFilter = tab.dataset.filter;
        fetchNotifications(currentFilter === 'unread');
      });
    });

    document.addEventListener('DOMContentLoaded', async () => {
      await markAllNotificationsReadOnVisit();
      fetchNotifications();
    });

    setInterval(() => {
      if (document.visibilityState === 'visible' && checkAuth()) {
        fetchNotifications(currentFilter === 'unread').catch(err => {
          console.log('Auto-refresh failed:', err.message);
        });
      }
    }, 30000);
  </script>
</body>
</html>
