<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reset Password — MarketMix Sellers</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --bg: #f4f1ec; --card: #ffffff; --ink: #1a1a1a; --ink2: #5a5a5a;
      --accent: #1e40af; --accent-light: #dbeafe; --border: #e5e0d8;
      --red: #dc2626; --green: #16a34a; --r: 14px;
      --shadow: 0 8px 32px rgba(0,0,0,0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--ink);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }
    .box {
      width: 100%; max-width: 420px; background: var(--card);
      border-radius: var(--r); border: 1px solid var(--border);
      box-shadow: var(--shadow); padding: 36px 32px; text-align: center;
    }
    .icon-badge {
      width: 56px; height: 56px; border-radius: 50%;
      background: var(--accent-light); color: var(--accent);
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; margin: 0 auto 18px;
    }
    .brand { font-family: 'Playfair Display', serif; font-size: 1.1rem; color: var(--accent); margin-bottom: 4px; }
    h2 { font-size: 1.4rem; margin-bottom: 8px; }
    p.sub { color: var(--ink2); font-size: 13.5px; line-height: 1.6; margin-bottom: 22px; }
    .form-group { text-align: left; margin-bottom: 14px; }
    .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
    .input-wrap { position: relative; }
    input {
      width: 100%; padding: 11px 40px 11px 14px; border: 1.5px solid var(--border);
      border-radius: 9px; font-size: 14px; font-family: 'DM Sans', sans-serif;
      background: #fff; transition: border-color .2s;
    }
    input:focus { outline: none; border-color: var(--accent); }
    .toggle-eye {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      cursor: pointer; color: var(--ink2); font-size: 14px; background: none; border: none;
    }
    .strength-bar { height: 4px; border-radius: 2px; margin-top: 6px; background: var(--border); overflow: hidden; }
    .strength-fill { height: 100%; width: 0%; border-radius: 2px; transition: width .3s, background .3s; }
    .strength-label { font-size: 11px; color: var(--ink2); margin-top: 3px; text-align: left; min-height: 14px; }
    .field-err { font-size: 11px; color: var(--red); margin-top: 4px; text-align: left; display: none; }
    .btn {
      width: 100%; padding: 12px; border: none; border-radius: 9px; margin-top: 6px;
      font-size: 14.5px; font-weight: 600; cursor: pointer;
      background: var(--accent); color: #fff;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: opacity .2s, transform .1s;
    }
    .btn:active { transform: scale(.98); }
    .btn:disabled { opacity: .6; cursor: not-allowed; }
    #msg {
      margin-top: 16px; font-size: 13.5px; padding: 10px 12px;
      border-radius: 8px; display: none; line-height: 1.5;
    }
    #msg.show { display: block; }
    #msg.success { background: #f0fdf4; color: var(--green); border: 1px solid #bbf7d0; }
    #msg.error   { background: #fef2f2; color: var(--red); border: 1px solid #fecaca; }
    .invalid-state { display: none; }
    .invalid-state.show { display: block; }
    .invalid-state i { font-size: 36px; color: var(--red); opacity: .7; margin-bottom: 12px; display: block; }
  </style>
</head>
<body>
  <div class="box">

    <div id="validView">
      <div class="icon-badge"><i class="fas fa-lock"></i></div>
      <div class="brand">MarketMix</div>
      <h2>Reset your password</h2>
      <p class="sub">Choose a new password for your seller account.</p>

      <form id="resetForm">
        <div class="form-group">
          <label>New Password</label>
          <div class="input-wrap">
            <input type="password" id="newPassword" placeholder="At least 8 characters" required minlength="8" oninput="checkStrength(this.value)" />
            <button type="button" class="toggle-eye" onclick="toggleVisibility('newPassword', this)"><i class="fas fa-eye"></i></button>
          </div>
          <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
          <div class="strength-label" id="strengthLabel"></div>
        </div>

        <div class="form-group">
          <label>Confirm New Password</label>
          <div class="input-wrap">
            <input type="password" id="confirmPassword" placeholder="Repeat new password" required />
            <button type="button" class="toggle-eye" onclick="toggleVisibility('confirmPassword', this)"><i class="fas fa-eye"></i></button>
          </div>
          <div class="field-err" id="err-confirm">Passwords do not match</div>
        </div>

        <button class="btn" type="submit" id="resetBtn">
          <i class="fas fa-check"></i> Reset Password
        </button>
      </form>

      <div id="msg"></div>
    </div>

    <div class="invalid-state" id="invalidView">
      <i class="fas fa-exclamation-triangle"></i>
      <h2>Invalid or missing link</h2>
      <p class="sub">This reset link is invalid. Please request a new one.</p>
      <a href="sellers/forgot-password.html" class="btn" style="text-decoration:none;display:inline-flex">
        <i class="fas fa-redo"></i> Request new link
      </a>
    </div>

  </div>

<script>
const API = 'https://marketmix-backend.onrender.com/api';
const token = new URLSearchParams(window.location.search).get('token');

if (!token) {
  document.getElementById('validView').style.display = 'none';
  document.getElementById('invalidView').classList.add('show');
}

function toggleVisibility(id, btn) {
  const input = document.getElementById(id);
  const isPwd = input.type === 'password';
  input.type = isPwd ? 'text' : 'password';
  btn.innerHTML = `<i class="fas fa-eye${isPwd ? '-slash' : ''}"></i>`;
}

function checkStrength(val) {
  const fill = document.getElementById('strengthFill');
  const label = document.getElementById('strengthLabel');
  let score = 0;
  if (val.length >= 8) score++;
  if (/[A-Z]/.test(val)) score++;
  if (/[0-9]/.test(val)) score++;
  if (/[^A-Za-z0-9]/.test(val)) score++;
  const map = [
    { w: '0%', bg: 'transparent', txt: '' },
    { w: '25%', bg: '#dc2626', txt: 'Weak' },
    { w: '50%', bg: '#d97706', txt: 'Fair' },
    { w: '75%', bg: '#2563eb', txt: 'Good' },
    { w: '100%', bg: '#16a34a', txt: 'Strong' },
  ];
  fill.style.width = map[score].w;
  fill.style.background = map[score].bg;
  label.textContent = map[score].txt;
}

function showMsg(text, type) {
  const msg = document.getElementById('msg');
  msg.textContent = text;
  msg.className = `show ${type}`;
}

document.getElementById('resetForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const newPassword = document.getElementById('newPassword').value;
  const confirm = document.getElementById('confirmPassword').value;
  const errConfirm = document.getElementById('err-confirm');
  errConfirm.style.display = 'none';

  if (newPassword !== confirm) {
    errConfirm.style.display = 'block';
    return;
  }

  const btn = document.getElementById('resetBtn');
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Resetting...';

  try {
    const res = await fetch(`${API}/auth/reset-password`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, newPassword })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.message);

    showMsg('Password reset! Redirecting to login...', 'success');
    document.getElementById('resetForm').style.display = 'none';
    setTimeout(() => window.location.href = 'sellers-login.html', 2000);
  } catch (err) {
    showMsg(err.message || 'Reset failed. Link may be expired.', 'error');
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-check"></i> Reset Password';
  }
});
</script>
</body>
</html>
