<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Your Stores — MarketMix</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --bg: #f4f1ec;
      --card: #ffffff;
      --ink: #1a1a1a;
      --ink2: #5a5a5a;
      --accent: #1e40af;
      --accent-light: #dbeafe;
      --gold: #b45309;
      --green: #16a34a;
      --red: #dc2626;
      --border: #e5e0d8;
      --shadow: 0 2px 16px rgba(0,0,0,0.08);
      --r: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
    }

    /* ── Nav ── */
    .nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      background: var(--ink);
      height: 58px;
      display: flex; align-items: center;
      padding: 0 24px;
      gap: 20px;
    }
    .nav-brand { color: #fff; font-family: 'Playfair Display', serif; font-size: 1.25rem; text-decoration: none; }
    .nav-back  { color: #aaa; font-size: 13px; text-decoration: none; display: flex; align-items: center; gap: 6px; margin-left: auto; transition: color .2s; }
    .nav-back:hover { color: #fff; }

    /* ── Layout ── */
    .page { max-width: 1100px; margin: 0 auto; padding: 82px 24px 60px; }

    /* ── Header ── */
    .page-header { margin-bottom: 32px; }
    .page-header h1 { font-family: 'Playfair Display', serif; font-size: 2rem; margin-bottom: 6px; }
    .page-header p  { color: var(--ink2); font-size: 14px; }

    /* ── Store Grid ── */
    .store-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
      margin-bottom: 24px;
    }

    /* ── Store Card ── */
    .store-card {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: var(--r);
      padding: 24px;
      cursor: pointer;
      transition: border-color .2s, box-shadow .2s, transform .15s;
      position: relative;
    }
    .store-card:hover { border-color: var(--accent); box-shadow: var(--shadow); transform: translateY(-2px); }
    .store-card.active {
      border-color: var(--accent);
      background: linear-gradient(135deg, #eff6ff 0%, #ffffff 100%);
    }
    .store-card.active::before {
      content: 'ACTIVE';
      position: absolute; top: 14px; right: 14px;
      background: var(--accent); color: #fff;
      font-size: 10px; font-weight: 700; letter-spacing: 1px;
      padding: 3px 8px; border-radius: 20px;
    }

    .card-header { display: flex; gap: 14px; align-items: flex-start; margin-bottom: 16px; }
    .store-logo {
      width: 56px; height: 56px; border-radius: 10px; object-fit: cover;
      background: var(--bg); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; color: var(--ink2); flex-shrink: 0;
    }
    .store-logo img { width: 100%; height: 100%; object-fit: cover; border-radius: 10px; }
    .card-titles h2 { font-size: 1.05rem; font-weight: 600; }
    .card-titles .store-num { font-size: 11px; color: var(--ink2); margin-top: 2px; }
    .card-titles .verified { color: var(--green); font-size: 11px; margin-top: 4px; }

    .card-stats {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 10px; margin-bottom: 16px;
    }
    .stat { text-align: center; padding: 10px 4px; background: var(--bg); border-radius: 8px; }
    .stat-val { font-size: 1.1rem; font-weight: 700; }
    .stat-lbl { font-size: 10px; color: var(--ink2); margin-top: 2px; }

    .card-actions { display: flex; gap: 8px; }
    .btn {
      flex: 1; padding: 9px 12px; border: none; border-radius: 8px;
      font-size: 13px; font-weight: 600; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      transition: opacity .2s, transform .1s;
    }
    .btn:active { transform: scale(.97); }
    .btn-primary   { background: var(--accent); color: #fff; }
    .btn-outline   { background: transparent; border: 1.5px solid var(--border); color: var(--ink); }
    .btn-outline:hover { border-color: var(--accent); color: var(--accent); }
    .btn-green     { background: var(--green); color: #fff; }
    .btn-sm        { font-size: 12px; padding: 7px 10px; }

    /* ── Create Store Card ── */
    .create-card {
      background: var(--card);
      border: 2px dashed var(--border);
      border-radius: var(--r);
      padding: 40px 24px;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; gap: 12px;
      cursor: pointer;
      transition: border-color .2s, background .2s;
    }
    .create-card:hover { border-color: var(--accent); background: #f0f6ff; }
    .create-card .create-icon {
      width: 56px; height: 56px; border-radius: 50%;
      background: var(--accent-light); color: var(--accent);
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
    }
    .create-card h3 { font-size: 1rem; font-weight: 600; }
    .create-card p  { font-size: 13px; color: var(--ink2); max-width: 200px; line-height: 1.5; }
    .create-card .kyc-warn {
      font-size: 12px; color: var(--gold);
      background: #fef3c7; border-radius: 6px; padding: 6px 10px;
      display: flex; align-items: center; gap: 6px;
    }

    /* ── Real-time Preview Section ── */
    .preview-section { margin-top: 36px; }
    .preview-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 16px;
    }
    .preview-header h2 { font-size: 1.1rem; font-weight: 600; }
    .preview-store-badge {
      font-size: 12px; color: var(--accent);
      background: var(--accent-light); padding: 4px 10px; border-radius: 20px;
    }

    .preview-frame-wrap {
      background: var(--card); border-radius: var(--r);
      border: 1px solid var(--border);
      overflow: hidden;
      position: relative;
    }
    .preview-toolbar {
      background: #f5f5f5; border-bottom: 1px solid var(--border);
      padding: 8px 14px; display: flex; align-items: center; gap: 8px;
    }
    .dot { width: 10px; height: 10px; border-radius: 50%; }
    .dot-r { background: #ff5f56; } .dot-y { background: #ffbd2e; } .dot-g { background: #27c93f; }
    .url-bar {
      flex: 1; background: #e8e8e8; border-radius: 6px;
      padding: 4px 10px; font-size: 12px; color: #555;
      font-family: monospace;
    }
    .preview-btn-bar { display: flex; gap: 8px; }
    .preview-btn-bar a {
      font-size: 12px; padding: 4px 10px; border-radius: 6px;
      text-decoration: none; font-weight: 600;
      background: var(--accent); color: #fff;
      display: flex; align-items: center; gap: 4px;
    }
    .preview-frame {
      width: 100%; height: 560px; border: none;
      display: block;
    }
    .preview-empty {
      height: 340px; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 12px; color: var(--ink2);
    }
    .preview-empty i { font-size: 40px; opacity: .3; }

    /* ── Toast ── */
    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
      background: var(--ink); color: #fff; padding: 12px 20px;
      border-radius: 8px; font-size: 14px; z-index: 999;
      transition: transform .3s; white-space: nowrap;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast.success { background: var(--green); }
    .toast.error   { background: var(--red); }

    /* ── Loading ── */
    .skeleton {
      background: linear-gradient(90deg, #e8e3da 25%, #f0ece4 50%, #e8e3da 75%);
      background-size: 200% 100%;
      animation: shimmer 1.3s infinite;
      border-radius: 6px;
    }
    @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

    .loading-card {
      background: var(--card); border: 2px solid var(--border);
      border-radius: var(--r); padding: 24px;
    }
    .skel-logo   { width:56px; height:56px; border-radius:10px; margin-bottom:12px; }
    .skel-title  { height:16px; width:60%; margin-bottom:8px; }
    .skel-sub    { height:12px; width:40%; }
    .skel-stats  { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:16px 0; }
    .skel-stat   { height:48px; border-radius:8px; }
    .skel-btn    { height:36px; border-radius:8px; }

    @media (max-width: 640px) {
      .store-grid { grid-template-columns: 1fr; }
      .preview-frame { height: 400px; }
    }
  </style>
</head>
<body>

<!-- Nav -->
<nav class="nav">
  <a href="sellers layout.html" class="nav-brand">MarketMix</a>
  <a href="sellers layout.html" class="nav-back"><i class="fas fa-arrow-left"></i> Dashboard</a>
</nav>

<!-- Page -->
<div class="page">
  <div class="page-header">
    <h1>Your Stores</h1>
    <p>Select your active store or view how buyers see your storefront.</p>
  </div>

  <!-- Store Grid -->
  <div class="store-grid" id="storeGrid">
    <!-- Loading skeletons -->
    <div class="loading-card">
      <div class="skeleton skel-logo"></div>
      <div class="skeleton skel-title"></div>
      <div class="skeleton skel-sub"></div>
      <div class="skel-stats">
        <div class="skeleton skel-stat"></div>
        <div class="skeleton skel-stat"></div>
        <div class="skeleton skel-stat"></div>
      </div>
      <div class="skeleton skel-btn"></div>
    </div>
  </div>

  <!-- Real-time Preview Section -->
  <div class="preview-section">
    <div class="preview-header">
      <h2><i class="fas fa-eye" style="margin-right:8px;color:var(--accent)"></i>Buyer's View</h2>
      <span class="preview-store-badge" id="previewBadge">No store selected</span>
    </div>
    <div class="preview-frame-wrap">
      <div class="preview-toolbar">
        <div class="dot dot-r"></div>
        <div class="dot dot-y"></div>
        <div class="dot dot-g"></div>
        <div class="url-bar" id="previewUrl">Select a store to preview</div>
        <div class="preview-btn-bar">
          <a href="#" id="previewOpenBtn" target="_blank" style="display:none">
            <i class="fas fa-external-link-alt"></i> Open
          </a>
        </div>
      </div>
      <div id="previewContainer">
        <div class="preview-empty">
          <i class="fas fa-store-slash"></i>
          <p>Select a store above to see how buyers see your shop.</p>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script src="storeManager.js"></script>
<script>
const API = 'https://marketmix-backend.onrender.com/api';

function getToken() {
  return localStorage.getItem('token') || '';
}

function toast(msg, type = '') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = `toast show ${type}`;
  setTimeout(() => el.classList.remove('show'), 3200);
}

function formatNum(n) {
  const v = parseFloat(n) || 0;
  return v >= 1000 ? '₦' + (v/1000).toFixed(1) + 'k' : '₦' + v.toFixed(0);
}

// ── Render stores ──────────────────────────────────────────────────────────────
function renderStores(stores, canCreate) {
  const grid = document.getElementById('storeGrid');
  const active = window.StoreManager.getActiveStore();
  const activeId = active?.id;

  let html = '';

  stores.forEach(s => {
    const isActive = s.id === activeId;
    const safeStore = JSON.stringify(s).replace(/"/g, '&quot;');
    const logoHtml = s.store_logo_url
      ? `<div class="store-logo"><img src="${s.store_logo_url}" alt="logo" onerror="this.parentElement.innerHTML='<i class=\\'fas fa-store\\'></i>'"></div>`
      : `<div class="store-logo"><i class="fas fa-store"></i></div>`;

    html += `
      <div class="store-card ${isActive ? 'active' : ''}" data-id="${s.id}">
        <div class="card-header">
          ${logoHtml}
          <div class="card-titles">
            <h2>${s.business_name || 'Unnamed Store'}</h2>
            <div class="store-num">Store #${s.store_number}</div>
            ${s.is_verified ? '<div class="verified"><i class="fas fa-check-circle"></i> Verified</div>' : ''}
          </div>
        </div>
        <div class="card-stats">
          <div class="stat">
            <div class="stat-val">${parseInt(s.product_count) || 0}</div>
            <div class="stat-lbl">Products</div>
          </div>
          <div class="stat">
            <div class="stat-val">${parseInt(s.total_orders || 0)}</div>
            <div class="stat-lbl">Orders</div>
          </div>
          <div class="stat">
            <div class="stat-val">${formatNum(s.total_earnings)}</div>
            <div class="stat-lbl">Earned</div>
          </div>
        </div>
        <div class="card-actions">
          ${isActive
            ? `<button class="btn btn-green btn-sm" disabled><i class="fas fa-check"></i> Active Store</button>`
            : `<button class="btn btn-primary btn-sm" onclick="selectStore('${s.id}')"><i class="fas fa-toggle-on"></i> Switch Here</button>`
          }
          <button class="btn btn-outline btn-sm" onclick="previewStore('${s.id}', '${(s.business_name||'').replace(/'/g,"\\'")}')">
            <i class="fas fa-eye"></i> Preview
          </button>
          <button class="btn btn-outline btn-sm" onclick="goToSettings('${s.id}')" title="Store Settings">
            <i class="fas fa-cog"></i>
          </button>
        </div>
      </div>`;
  });

  // Create card
  if (canCreate && stores.length < 2) {
    html += `
      <div class="create-card" onclick="window.location.href='setup-store.html'">
        <div class="create-icon"><i class="fas fa-plus"></i></div>
        <h3>Add Second Store</h3>
        <p>Expand your business with a second storefront under your account.</p>
      </div>`;
  } else if (!canCreate) {
    html += `
      <div class="create-card" style="cursor:default;pointer-events:none;opacity:.6">
        <div class="create-icon" style="background:#fef3c7;color:var(--gold)"><i class="fas fa-lock"></i></div>
        <h3>Verify KYC First</h3>
        <p>Complete KYC verification to unlock your second store.</p>
        <a href="kyc-verification.html" class="kyc-warn" style="pointer-events:all;cursor:pointer;text-decoration:none">
          <i class="fas fa-arrow-right"></i> Complete KYC
        </a>
      </div>`;
  }

  grid.innerHTML = html;

  // Auto-preview active store
  if (activeId) {
    const s = stores.find(s => s.id === activeId);
    if (s) previewStore(s.id, s.business_name);
  }
}

// ── Select store ──────────────────────────────────────────────────────────────
async function selectStore(storeId) {
  const token = getToken();
  const btn = document.querySelector(`[onclick="selectStore('${storeId}')"]`);
  if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>'; }

  try {
    const res  = await fetch(`${API}/seller/stores/${storeId}`, {
      headers: { Authorization: `Bearer ${token}` }
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.message);

    window.StoreManager.setActiveStore(data.data.store);
    toast('Switching to ' + (data.data.store.business_name || 'store') + '...', 'success');
    setTimeout(() => { window.location.href = 'sellers layout.html'; }, 900);
  } catch (e) {
    toast(e.message || 'Failed to switch store', 'error');
    if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fas fa-toggle-on"></i> Switch Here'; }
  }
}

// ── Go to settings for a specific store ──────────────────────────────────────
async function goToSettings(storeId) {
  const current = window.StoreManager.getActiveStore();
  if (current?.id === storeId) {
    window.location.href = 'sellers setting.html';
    return;
  }
  // Switch store first, then go to settings
  const token = getToken();
  try {
    const res  = await fetch(`${API}/seller/stores/${storeId}`, {
      headers: { Authorization: `Bearer ${token}` }
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.message);
    window.StoreManager.setActiveStore(data.data.store);
  } catch (e) { /* use cached data if fetch fails */ }
  window.location.href = 'sellers setting.html';
}

// ── Preview store ──────────────────────────────────────────────────────────────
function previewStore(storeId, storeName) {
  const baseUrl   = window.location.origin;
  const storeUrl  = `${baseUrl}/buyers/store-id.html?seller=${storeId}`;
  const container = document.getElementById('previewContainer');
  const urlBar    = document.getElementById('previewUrl');
  const openBtn   = document.getElementById('previewOpenBtn');
  const badge     = document.getElementById('previewBadge');

  badge.textContent   = storeName || 'Store Preview';
  urlBar.textContent  = storeUrl;
  openBtn.href        = storeUrl;
  openBtn.style.display = 'flex';

  container.innerHTML = `<iframe class="preview-frame" src="${storeUrl}" title="Store Preview" sandbox="allow-scripts allow-same-origin allow-forms"></iframe>`;
}

// ── Load stores ──────────────────────────────────────────────────────────────
async function loadStores() {
  const token = getToken();
  if (!token) { window.location.href = 'sellers login.html'; return; }

  try {
    const res  = await fetch(`${API}/seller/stores`, {
      headers: { Authorization: `Bearer ${token}` }
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.message);

    const stores    = data.data?.stores || [];
    const canCreate = data.data?.canCreateMore !== false;

    // If no active store set and stores exist, auto-set first
    if (!window.StoreManager.getActiveStore() && stores.length) {
      window.StoreManager.setActiveStore(stores[0]);
    }

    renderStores(stores, canCreate);
  } catch (e) {
    document.getElementById('storeGrid').innerHTML =
      `<div style="color:var(--red);padding:20px">${e.message || 'Failed to load stores'}</div>`;
  }
}

// Init
document.addEventListener('DOMContentLoaded', loadStores);
</script>
</body>
</html>
