<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seller Signup</title>
  <link rel="shortcut icon" href="../images/marketmixfavicon.png" type="image/x-icon">
  <link rel="stylesheet" href="../shared/notifications.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    :root {
      --bg: #eef4ff;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #475569;
      --accent: #1e40af;
      --accent-soft: #dbeafe;
      --border: #c7d2fe;
      --radius: 24px;
      --shadow: 0 28px 60px rgba(30, 64, 175, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(180deg, #eef4ff 0%, #f8fbff 100%);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .signup-container {
      width: 100%;
      max-width: 520px;
      background: var(--card);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      padding: 34px 32px;
    }

    .signup-container h2 {
      text-align: center;
      margin-bottom: 1rem;
      font-weight: 700;
      color: var(--text);
      font-size: 1.75rem;
    }

    .progressbar {
      display: flex;
      justify-content: space-between;
      margin-bottom: 1.75rem;
      counter-reset: step;
      gap: 12px;
    }

    .progressbar li {
      list-style: none;
      position: relative;
      flex: 1;
      text-align: center;
      color: #94a3b8;
      font-size: 0.85rem;
    }

    .progressbar li::before {
      counter-increment: step;
      content: counter(step);
      width: 32px;
      height: 32px;
      line-height: 32px;
      border: 1.5px solid var(--border);
      display: block;
      text-align: center;
      margin: 0 auto 10px;
      border-radius: 50%;
      background: #f8fbff;
      color: var(--muted);
      font-weight: 700;
    }

    .progressbar li.active::before {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }

    .progressbar li.active {
      color: var(--text);
    }

    .form-step {
      display: none;
      animation: fadeIn 0.35s ease;
    }

    .form-step.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .input-group {
      margin-bottom: 1rem;
    }

    .input-group input,
    .input-group select {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: #f8fbff;
      color: #0f172a;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-group input:focus,
    .input-group select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 5px rgba(30, 64, 175, 0.08);
      background: #fff;
    }

    .input-group input::placeholder {
      color: #94a3b8;
    }

    select option {
      background: #ffffff;
      color: #0f172a;
    }

    .error {
      font-size: 0.82rem;
      color: #dc2626;
      margin-top: 0.45rem;
      min-height: 18px;
    }

    .btn {
      width: 100%;
      padding: 0.95rem;
      border: none;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 0.85rem;
      transition: transform 0.2s, filter 0.2s;
    }

    .btn:hover:not(:disabled) {
      transform: translateY(-1px);
      filter: brightness(1.03);
    }

    .btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }

    .btn-google {
      background: #fff;
      color: #0f172a;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.65rem;
    }

    .btn-google img {
      width: 20px;
      height: 20px;
    }

    .divider {
      text-align: center;
      margin: 1.5rem 0;
      color: #64748b;
      font-size: 0.95rem;
    }

    .shake {
      animation: shake 0.3s;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    .password-group {
      position: relative;
    }

    .toggle-password {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      font-size: 1.1rem;
      color: #64748b;
      user-select: none;
      transition: color 0.2s;
    }

    .toggle-password:hover {
      color: var(--accent);
    }

    .strength-bar {
      height: 8px;
      border-radius: 999px;
      background: #e2e8f0;
      margin-top: 10px;
      overflow: hidden;
    }

    .strength-bar-fill {
      height: 100%;
      width: 0;
      transition: width 0.3s ease, background 0.3s ease;
      border-radius: 999px;
      background: #dc2626;
    }

    .toast {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 1rem 1.5rem;
      border-radius: 16px;
      color: #fff;
      font-weight: 600;
      z-index: 9999;
      animation: slideIn 0.3s ease;
      max-width: 360px;
    }

    .btn-back {
      background: #f8fbff;
      color: #1e40af;
      border: 1px solid #c7d2fe;
    }

    .btn-back:hover {
      background: #eef4ff;
    }

    .toast.success { background: #16a34a; }
    .toast.error { background: #dc2626; }
    .toast.info { background: #1e40af; }

    @keyframes slideIn {
      from { transform: translateX(120%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="signup-container">
    <h2>Seller Signup</h2>

    <ul class="progressbar">
      <li class="active">Step 1</li>
      <li>Step 2</li>
      <li>Step 3</li>
    </ul>

    <form id="signupForm">
      <!-- Step 1: Personal Info -->
      <div class="form-step active">
        <div class="input-group">
          <input type="text" id="fullname" placeholder="Full Name" required>
          <div class="error" id="error-fullname"></div>
        </div>
        <div class="input-group">
          <input type="email" id="email" placeholder="Email" required>
          <div class="error" id="error-email"></div>
        </div>
        <div class="input-group">
          <input type="tel" id="phone" placeholder="Phone Number" required>
          <div class="error" id="error-phone"></div>
        </div>
        <button type="button" class="btn btn-primary next-btn">Next</button>
      </div>

      <!-- Step 2: Store Info -->
      <div class="form-step">
        <div class="input-group">
          <input type="text" id="storeName" placeholder="Store Name" required>
          <div class="error" id="error-storeName"></div>
        </div>
        <!-- <div class="input-group">
          <select id="businessType" required>
            <option value="">Select Business Type</option>
            <option value="retail">Retail</option>
            <option value="wholesale">Wholesale</option>
            <option value="service">Service</option>
          </select>
          <div class="error" id="error-businessType"></div>
        </div> -->
        <div class="input-group">
          <select id="productCategory" required>
            <option value="">Select Store Category</option>
          </select>
          <div class="error" id="error-productCategory"></div>
        </div>
        <div class="input-group">
          <input type="text" id="address" placeholder="Business Address" required>
          <div class="error" id="error-address"></div>
        </div>
        <button type="button" class="btn btn-back prev-btn">Back</button>
        <button type="button" class="btn btn-primary next-btn">Next</button>
      </div>

      <!-- Step 3: Password -->
      <div class="form-step">
        <div class="input-group password-group">
          <input type="password" id="password" placeholder="Password (min 6 chars)" required>
          <span class="toggle-password" onclick="togglePassword('password', this)">👁</span>
          <div class="strength-bar"><div id="strength-bar-fill" class="strength-bar-fill"></div></div>
          <div class="error" id="error-password"></div>
        </div>
        <div class="input-group password-group">
          <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
          <span class="toggle-password" onclick="togglePassword('confirmPassword', this)">👁</span>
          <div class="error" id="error-confirmPassword"></div>
        </div>
        <button type="button" class="btn btn-back prev-btn">Back</button>
        <button type="submit" id="submitBtn" class="btn btn-primary">Create Account</button>
      </div>
    </form>

    <div class="divider">or</div>
    <button class="btn btn-google" onclick="handleGoogleSignup()">
      <img src="https://www.svgrepo.com/show/355037/google.svg" alt="Google Logo"> Sign up with Google
    </button>
    <p style="text-align:center; margin-top:1rem; color:#ccc;">
      Already have an account?
      <a href="sellers-login.html" style="color:#667eea; font-weight:600; text-decoration:none;">Log in</a>
    </p>
  </div>

  <script>
    // ─── Config ────────────────────────────────────────────────────────────────
    const API_BASE = 'https://marketmix-backend.onrender.com/api';

    // ─── Toast Notification ────────────────────────────────────────────────────
    function showToast(message, type = 'info') {
      // Try shared showNotification if available, else fallback
      if (typeof showNotification === 'function') {
        showNotification(message, type);
        return;
      }
      const existing = document.querySelector('.toast');
      if (existing) existing.remove();

      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.textContent = message;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 4000);
    }

    // ─── Multi-step form logic ─────────────────────────────────────────────────
    const formSteps   = document.querySelectorAll('.form-step');
    const nextBtns    = document.querySelectorAll('.next-btn');
    const progressbar = document.querySelectorAll('.progressbar li');
    let currentStep   = 0;

    function showStep(step) {
      formSteps.forEach((div, i) => {
        div.classList.toggle('active', i === step);
        progressbar[i].classList.toggle('active', i <= step);
      });
    }
function validateStep(step) {
  let isValid = true;
  const inputs = formSteps[step].querySelectorAll("input, select");

  inputs.forEach(input => {
    const errorDiv = document.getElementById("error-" + input.id);
    if (!errorDiv) return;

    // Reset error first
    errorDiv.textContent = "";

    if (!input.value.trim()) {
      errorDiv.textContent = "This field is required";
      isValid = false;
    } else {
      if (input.type === "email") {
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(input.value)) {
          errorDiv.textContent = "Enter a valid email";
          isValid = false;
        }
      }

      if (input.id === "phone") {
        if (!/^\+?\d{11}$/.test(input.value)) {
          errorDiv.textContent = "Phone number must be exactly 11 digits";
          isValid = false;
        }
      }

      if (input.id === "password" && input.value.length < 6) {
        errorDiv.textContent = "Password must be at least 6 characters";
        isValid = false;
      }

      if (input.id === "confirmPassword") {
        if (input.value !== document.getElementById("password").value) {
          errorDiv.textContent = "Passwords do not match";
          isValid = false;
        }
      }
    }
  });

  if (!isValid) {
    formSteps[step].classList.add("shake");
    setTimeout(() => formSteps[step].classList.remove("shake"), 300);
  }

  return isValid;
}


    nextBtns.forEach(() => {
      // We add one listener per button via index
    });
    
    const prevBtns = document.querySelectorAll(".prev-btn");
prevBtns.forEach((btn) => {
  btn.addEventListener("click", () => {
    if (currentStep > 0) {
      currentStep--;
      showStep(currentStep);
    }
  });
});

    document.querySelectorAll('.next-btn').forEach((btn, index) => {
      btn.addEventListener('click', () => {
        if (validateStep(currentStep)) {
          currentStep++;
          showStep(currentStep);
        }
      });
    });

    // ─── Form Submit: Register + Setup Profile ─────────────────────────────────
    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!validateStep(currentStep)) return;

      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating account...';

      const fullname       = document.getElementById('fullname').value.trim();
      const email          = document.getElementById('email').value.trim();
      const phone          = document.getElementById('phone').value.trim();
      const storeName      = document.getElementById('storeName').value.trim();
      const businessType   = document.getElementById('businessType')?.value || '';
      const productCategory = document.getElementById('productCategory').value;
      const productCategoryName = document.getElementById('productCategory').selectedOptions[0]?.text || '';
      const address        = document.getElementById('address').value.trim();
      const password       = document.getElementById('password').value;

      try {
        // ── Step 1: Register the user with role=seller ──────────────────────
        const registerRes = await fetch(`${API_BASE}/auth/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            fullName: fullname,
            email,
            phone,
            password,
            role: 'seller'
          })
        });

        const registerData = await registerRes.json();

        if (!registerRes.ok) {
          const msg = registerData.message || 'Registration failed. Please try again.';
          showToast(msg, 'error');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Create Account';
          return;
        }

        const token = registerData.data?.token || registerData.token;
        if (!token) {
          showToast('Registration succeeded but no token returned. Please log in.', 'error');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Create Account';
          return;
        }

        // Persist token for subsequent pages
        // Role-specific keys
        localStorage.setItem('seller_token', token);
        localStorage.setItem('seller_user', JSON.stringify(registerData.data?.user || {}));
        // Keep legacy keys for backward compat
        localStorage.setItem('token', token);
        // Save signup details for setup-store prefill
        localStorage.setItem('signupDetails', JSON.stringify({
          fullName: fullname,
          email,
          phone,
          storeName,
          businessType,
          productCategory,
          productCategoryName,
          address
        }));
        localStorage.setItem('user', JSON.stringify(registerData.data?.user || {}));

        // ── Step 2: Save seller store profile ──────────────────────────────
        submitBtn.textContent = 'Setting up store...';

        const profileRes = await fetch(`${API_BASE}/seller/setup-profile`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ storeName, businessType, productCategory, address })
        });

        const profileData = await profileRes.json();

        if (!profileRes.ok) {
          // Registration succeeded — warn but don't block
          console.warn('Store profile setup failed:', profileData.message);
          showToast('Account created! Store details can be updated in your dashboard.', 'info');
        } else {
          showToast('Account created successfully! Welcome aboard 🚀', 'success');
        }
        // Always save chosen category so setup-store can preselect it
        try {
          localStorage.setItem('signupCategory', productCategory || '');
          console.log('Signup: saved signupCategory to localStorage:', productCategory);
        } catch (e) {
          console.warn('Unable to persist signupCategory', e);
        }

        // ── Redirect to store setup / dashboard ────────────────────────────
        setTimeout(() => {
          window.location.href = 'setup-store.html';
        }, 2000);

      } catch (err) {
        console.error('Signup error:', err);
        showToast('Network error. Please check your connection and try again.', 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create Account';
      }
    });

    // ─── Google Signup (placeholder — wire up your OAuth flow here) ───────────
    function handleGoogleSignup() {
      showToast('Google signup coming soon!', 'info');
      // TODO: implement Google OAuth → POST /api/auth/google-register with role:'seller'
    }
    // ─── Load real categories from backend ─────────────────────────────────────
    async function loadProductCategories() {
      const select = document.getElementById('productCategory');
      if (!select) return;
      try {
        const res = await fetch(`${API_BASE}/categories`);
        const data = await res.json();
        const cats = data?.data || [];
        select.innerHTML = '<option value="">Select Product Category</option>' +
          cats.map(c => `<option value="${c.id}" data-name="${c.name}">${c.name}</option>`).join('');
      } catch (err) {
        console.warn('Could not load categories:', err);
      }
    }
    // ─── Password helpers ──────────────────────────────────────────────────────
    function togglePassword(fieldId, el) {
      const input = document.getElementById(fieldId);
      if (input.type === 'password') {
        input.type = 'text';
        el.textContent = '🙈';
      } else {
        input.type = 'password';
        el.textContent = '👁';
      }
    }

    const passwordInput    = document.getElementById('password');
    const strengthBarFill  = document.getElementById('strength-bar-fill');

    passwordInput.addEventListener('input', () => {
      const val = passwordInput.value;
      let strength = 0;
      if (val.length >= 6)            strength++;
      if (/[A-Z]/.test(val))          strength++;
      if (/[0-9]/.test(val))          strength++;
      if (/[^A-Za-z0-9]/.test(val))   strength++;

      const widths = ['0%', '25%', '50%', '75%', '100%'];
      const colors = ['#ff6b6b', '#ff884d', '#ffcc00', '#4CAF50'];
      strengthBarFill.style.width      = widths[strength];
      strengthBarFill.style.background = colors[Math.max(0, strength - 1)] || '';
    });

    // ─── Init ──────────────────────────────────────────────────────────────────
    loadProductCategories();
    showStep(currentStep);

    // If the signup page was opened to resume an interrupted store setup,
    // show a clear message so the user knows to log in instead of seeing
    // a confusing error or dead-end.
    try {
      const params = new URLSearchParams(window.location.search || '');
      if (params.has('resumeSetup')) {
        showToast('Log in to continue your setup', 'info');
      }
    } catch (e) { /* ignore */ }
  </script>
</body>
</html>
